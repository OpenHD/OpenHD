name: Fleet video output
on:
  workflow_dispatch:
  push:
    branches: [openhd-3.0]
    paths:
      - OpenHD/ohd_video/**
      - OpenHD/ohd_common/inc/openhd_fleet_video_lease.hpp
      - scripts/*fleet*
      - .github/workflows/fleet-video-output.yml
  pull_request:
    branches: [openhd-3.0]
    paths:
      - OpenHD/ohd_video/**
      - OpenHD/ohd_common/inc/openhd_fleet_video_lease.hpp
      - scripts/*fleet*
      - .github/workflows/fleet-video-output.yml
jobs:
  output:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y g++ libunwind-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav
      - name: Validate device profiles
        run: python3 scripts/test_fleet_setup.py
      - name: Verify VEYE and USB capture device isolation
        working-directory: OpenHD/ohd_video
        run: |
          g++ -std=c++17 -O2 -Iinc test/test_v4l2_camera_selection.cpp -o /tmp/test_v4l2_camera_selection
          /tmp/test_v4l2_camera_selection
          g++ -std=c++17 -O2 -Iinc test/test_rockchip_backend_policy.cpp -o /tmp/test_rockchip_backend_policy
          /tmp/test_rockchip_backend_policy
      - name: Build and exercise independent UDP outputs
        working-directory: OpenHD/ohd_video
        run: |
          g++ -std=c++17 -O2 -pthread -Iinc -I../ohd_common/inc test/test_fleet_video_lease.cpp -o /tmp/test_fleet_video_lease
          /tmp/test_fleet_video_lease
          g++ -std=c++17 -O2 -pthread -Iinc -I../ohd_common/inc src/gst_video_output.cpp test/relay_video_output.cpp $(pkg-config --cflags --libs gstreamer-app-1.0) -latomic -o /tmp/relay_video_output
          g++ -std=c++17 -O2 -pthread -Iinc -I../ohd_common/inc src/gst_video_output.cpp test/test_video_output.cpp $(pkg-config --cflags --libs gstreamer-app-1.0) -latomic -o /tmp/test_video_output
          /tmp/test_video_output
          /tmp/test_video_output encoded
          /tmp/test_video_output rtp
