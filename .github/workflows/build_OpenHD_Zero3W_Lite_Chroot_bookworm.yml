name: build_openhd_zero3w_lite_bookworm

on:
  workflow_dispatch:
  push:
    branches:
      - "openhd-3.0"
      - "dev-release"
      - "release"

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
      API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
      DOWNLOAD_KEY: ${{ secrets.DOWNLOAD_KEY }}
      DOWNLOAD_URL: ${{ secrets.DOWNLOAD_URL }}
      OPENHD_SUBMODULE_TOKEN: ${{ secrets.OPENHD_SUBMODULE_TOKEN }}
      ARTLINK_REPO: https://github.com/OpenHD-Technologies/OpenHD-ArtLink.git
      ARTLINK_BRANCH: sdk
      ARTLINK_FETCH_MODE: git-only
      ARTLINK_GIT_AUTH_USERNAME: raphael@openhdfpv.org
      ARTLINK_GIT_AUTH: "raphael@openhdfpv.org:${{ secrets.OPENHD_SUBMODULE_TOKEN }}"
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 512
          swap-size-mb: 1024
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          overprovision-lvm: "true"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false
          token: ${{ secrets.OPENHD_SUBMODULE_TOKEN }}

      - name: Download submodules with private token
        run: |
          if [ -z "${OPENHD_SUBMODULE_TOKEN}" ]; then
            echo "OPENHD_SUBMODULE_TOKEN is required for recursive submodules"
            exit 1
          fi
          cleanup_git_auth() {
            git config --global --unset-all url."https://x-access-token:${OPENHD_SUBMODULE_TOKEN}@github.com/".insteadOf || true
          }
          trap cleanup_git_auth EXIT
          git config --global url."https://x-access-token:${OPENHD_SUBMODULE_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule sync --recursive
          git submodule update --init --recursive
          git submodule status --recursive

      - name: Build OpenHD in Zero3W Lite CHROOT
        run: |
          git clone https://github.com/OpenHD/OpenHD-ChrootCompiler /opt/OpenHD-ChrootCompiler
          mkdir -p /opt/OpenHD-ChrootCompiler/additionalFiles
          cp -a "$GITHUB_WORKSPACE/." /opt/OpenHD-ChrootCompiler/additionalFiles/
          printf '%s\n' "$CLOUDSMITH_API_KEY" > /opt/OpenHD-ChrootCompiler/additionalFiles/cloudsmith_api_key.txt
          printf '%s\n' "$DOWNLOAD_URL" > /opt/OpenHD-ChrootCompiler/additionalFiles/download_url.txt
          printf '%s\n' "$DOWNLOAD_KEY" > /opt/OpenHD-ChrootCompiler/additionalFiles/download_key.txt
          printf '%s\n' "$ARTLINK_REPO" > /opt/OpenHD-ChrootCompiler/additionalFiles/artlink_repo.txt
          printf '%s\n' "$ARTLINK_BRANCH" > /opt/OpenHD-ChrootCompiler/additionalFiles/artlink_branch.txt
          printf '%s\n' "$ARTLINK_FETCH_MODE" > /opt/OpenHD-ChrootCompiler/additionalFiles/artlink_fetch_mode.txt
          printf '%s\n' "$ARTLINK_GIT_AUTH" > /opt/OpenHD-ChrootCompiler/additionalFiles/artlink_git_auth.txt
          printf '%s\n' "$ARTLINK_GIT_AUTH_USERNAME" > /opt/OpenHD-ChrootCompiler/additionalFiles/artlink_git_username.txt
          printf '%s\n' "$OPENHD_SUBMODULE_TOKEN" > /opt/OpenHD-ChrootCompiler/additionalFiles/artlink_git_token.txt
          echo "1" > /opt/OpenHD-ChrootCompiler/additionalFiles/skip_cloudsmith_cli_install.txt
          echo "standard" > /opt/OpenHD-ChrootCompiler/additionalFiles/custom.txt
          echo "arm64" > /opt/OpenHD-ChrootCompiler/additionalFiles/arch.txt
          echo "debian" > /opt/OpenHD-ChrootCompiler/additionalFiles/distro.txt
          echo "bookworm" > /opt/OpenHD-ChrootCompiler/additionalFiles/flavor.txt
          echo "${{ github.ref_name }}" > /opt/OpenHD-ChrootCompiler/additionalFiles/repo.txt

          cd /opt/OpenHD-ChrootCompiler/
          sudo apt update
          sudo bash install_dep.sh
          export OPENHD_CHROOT_HOST_OUT_DIR="$GITHUB_WORKSPACE/chroot-out/zero3w-lite"
          mkdir -p "$OPENHD_CHROOT_HOST_OUT_DIR"
          python3 - <<'PY'
          from pathlib import Path

          common_sh = Path("/opt/OpenHD-ChrootCompiler/scripts/common.sh")
          common_text = common_sh.read_text()
          workspace_out_marker = "OPENHD_CHROOT_HOST_OUT_DIR"
          if workspace_out_marker not in common_text:
              old_out_block = (
                  "    cd ../../\n"
                  "    mkdir out\n"
                  "    cd out\n"
                  "    echo \"$PWD\"  > ../additionalFiles/pwd.txt\n"
                  "    cat ../additionalFiles/pwd.txt\n"
                  "    cd ..\n"
                  "    cd $(cat pwd1.txt)\n"
              )
              new_out_block = (
                  "    cd ../../\n"
                  "    mkdir -p \"${OPENHD_CHROOT_HOST_OUT_DIR}\"\n"
                  "    cd \"${OPENHD_CHROOT_HOST_OUT_DIR}\"\n"
                  "    echo \"$PWD\" > \"${STAGE_DIR}/../../additionalFiles/pwd.txt\"\n"
                  "    echo \"$PWD\" > \"${STAGE_DIR}/../../additionalFiles/host_out_dir.txt\"\n"
                  "    cat \"${STAGE_DIR}/../../additionalFiles/pwd.txt\"\n"
                  "    cd \"$(cat \"${STAGE_DIR}/../../pwd1.txt\")\"\n"
              )
              if old_out_block not in common_text:
                  raise SystemExit("Could not find ChrootCompiler out directory block in common.sh")
              common_text = common_text.replace(old_out_block, new_out_block, 1)
              old_capsh_block = (
                  "    cp -r \"${STAGE_DIR}/../../additionalFiles\" \"${MNT_DIR}/opt\"\n"
                  "    capsh --drop=cap_setfcap \"--chroot=${MNT_DIR}/\" -- \"$@\"\n"
                  "\n"
                  "    umount -l \"${MNT_DIR}/etc/resolv.conf\"\n"
              )
              new_capsh_block = (
                  "    cp -r \"${STAGE_DIR}/../../additionalFiles\" \"${MNT_DIR}/opt\"\n"
                  "    if [[ -n \"${OPENHD_CHROOT_HOST_OUT_DIR:-}\" ]]; then\n"
                  "        mkdir -p \"${OPENHD_CHROOT_HOST_OUT_DIR}\" \"${MNT_DIR}/out\"\n"
                  "        mountpoint -q \"${MNT_DIR}/out\" || mount --bind \"${OPENHD_CHROOT_HOST_OUT_DIR}\" \"${MNT_DIR}/out\"\n"
                  "    fi\n"
                  "    capsh --drop=cap_setfcap \"--chroot=${MNT_DIR}/\" -- \"$@\"\n"
                  "\n"
                  "    if mount | grep -q \"${MNT_DIR}/out\"; then\n"
                  "        umount -l \"${MNT_DIR}/out\"\n"
                  "    fi\n"
                  "    umount -l \"${MNT_DIR}/etc/resolv.conf\"\n"
              )
              if old_capsh_block not in common_text:
                  raise SystemExit("Could not find ChrootCompiler capsh block in common.sh")
              common_text = common_text.replace(old_capsh_block, new_capsh_block, 1)
              common_sh.write_text(common_text)

          chroot_build = Path("/opt/OpenHD-ChrootCompiler/additionalFiles/build_chroot.sh")
          chroot_text = chroot_build.read_text()
          early_skip_cloudsmith = (
              'if [[ -f skip_cloudsmith_cli_install.txt ]]; then\n'
              '    SKIP_CLOUDSMITH_CLI_INSTALL="$(tr -d \'\\r\\n\' < skip_cloudsmith_cli_install.txt)"\n'
              '    export SKIP_CLOUDSMITH_CLI_INSTALL\n'
              'fi\n\n'
          )
          chroot_text = chroot_text.replace(
              'ARTOSYN_SDK_ARCHIVE_FILE_VALUE="$(read_optional_file artosyn_sdk_archive.txt)"',
              'SKIP_CLOUDSMITH_CLI_INSTALL_FILE_VALUE="$(read_optional_file skip_cloudsmith_cli_install.txt)"\n'
              'if [[ -n "${SKIP_CLOUDSMITH_CLI_INSTALL_FILE_VALUE}" ]]; then\n'
              '    export SKIP_CLOUDSMITH_CLI_INSTALL="${SKIP_CLOUDSMITH_CLI_INSTALL_FILE_VALUE}"\n'
              'fi\n\n'
              'ARTOSYN_SDK_ARCHIVE_FILE_VALUE="$(read_optional_file artosyn_sdk_archive.txt)"',
              1,
          )
          chroot_text = chroot_text.replace(
              'pip3 install --upgrade cloudsmith-cli || { echo "Failed to install cloudsmith-cli"; exit 1; }',
              'if [[ "${SKIP_CLOUDSMITH_CLI_INSTALL:-0}" != "1" ]]; then\n'
              '    pip3 install --upgrade cloudsmith-cli \\\n'
              '        || pip3 install --upgrade cloudsmith-cli --break-system-packages \\\n'
              '        || { echo "Failed to install cloudsmith-cli"; exit 1; }\n'
              'else\n'
              '    echo "Skipping cloudsmith-cli install in chroot."\n'
              'fi',
              1,
          )
          if 'SKIP_CLOUDSMITH_CLI_INSTALL="$(tr -d' not in chroot_text:
              cloudsmith_needle = 'if [[ "${SKIP_CLOUDSMITH_CLI_INSTALL:-0}" != "1" ]]; then\n'
              if cloudsmith_needle not in chroot_text:
                  raise SystemExit("Could not find cloudsmith-cli install block in build_chroot.sh")
              chroot_text = chroot_text.replace(cloudsmith_needle, early_skip_cloudsmith + cloudsmith_needle, 1)
          chroot_marker = "sanitize_radxa_sources_for_current_distro"
          chroot_needle = "# Update package lists and install necessary packages as root\n"
          chroot_patch = (
              "sanitize_radxa_sources_for_current_distro() {\n"
              "    local codename=\"\"\n"
              "    codename=\"$(. /etc/os-release; echo \"${VERSION_CODENAME:-}\")\"\n"
              "    [[ -n \"${codename}\" ]] || return 0\n"
              "\n"
              "    for source_file in /etc/apt/sources.list /etc/apt/sources.list.d/*.list; do\n"
              "        [[ -f \"$source_file\" ]] || continue\n"
              "        if [[ \"${codename}\" == \"bookworm\" ]]; then\n"
              "            sed -i -E '/radxa-repo\\.github\\.io\\/bullseye|radxa-repo\\.github\\.io[[:space:]]+bullseye/s/^[[:space:]]*deb/# deb/' \"$source_file\"\n"
              "        elif [[ \"${codename}\" == \"bullseye\" ]]; then\n"
              "            sed -i -E '/radxa-repo\\.github\\.io\\/bookworm|radxa-repo\\.github\\.io\\/rk3566-bookworm|radxa-repo\\.github\\.io[[:space:]]+bookworm|radxa-repo\\.github\\.io[[:space:]]+rk3566-bookworm/s/^[[:space:]]*deb/# deb/' \"$source_file\"\n"
              "        fi\n"
              "    done\n"
              "}\n"
              "\n"
              "sanitize_radxa_sources_for_current_distro\n"
              "\n"
          )
          if chroot_marker not in chroot_text:
              if chroot_needle not in chroot_text:
                  raise SystemExit("Could not find apt update block in build_chroot.sh")
              chroot_text = chroot_text.replace(chroot_needle, chroot_patch + chroot_needle, 1)
          if "free_chroot_space_for_ci()" not in chroot_text:
              cleanup_needle = "ensure_artosyn_cmake() {\n"
              cleanup_patch = (
                  "free_chroot_space_for_ci() {\n"
                  "    echo \"Freeing image space for CI package build.\"\n"
                  "    apt-get clean || true\n"
                  "    rm -rf /var/cache/apt/archives/*.deb /var/cache/man/* /var/lib/apt/lists/* || true\n"
                  "    rm -rf /usr/share/doc/* /usr/share/man/* /usr/share/locale/* || true\n"
                  "\n"
                  "    local purge_packages=\"\"\n"
                  "    purge_packages=\"$(dpkg-query -W -f='${binary:Package}\\n' 2>/dev/null \\\n"
                  "        | grep -E '^(akonadi|baloo|calligra|kde|kio|kmail|konsole|kscreen|kwin|libreoffice|plasma|sddm|xorg|xserver-xorg)' \\\n"
                  "        | tr '\\n' ' ' || true)\"\n"
                  "    if [[ -n \"${purge_packages}\" ]]; then\n"
                  "        apt-get purge -y ${purge_packages} || true\n"
                  "        apt-get autoremove -y || true\n"
                  "    fi\n"
                  "\n"
                  "    apt-get clean || true\n"
                  "    rm -rf /var/cache/apt/archives/*.deb /var/cache/man/* || true\n"
                  "    df -h /\n"
                  "}\n"
                  "\n"
              )
              if cleanup_needle not in chroot_text:
                  raise SystemExit("Could not find ensure_artosyn_cmake in build_chroot.sh")
              chroot_text = chroot_text.replace(cleanup_needle, cleanup_patch + cleanup_needle, 1)
          if "free_chroot_space_for_ci\n    apt-get update --fix-missing" not in chroot_text:
              chroot_text = chroot_text.replace(
                  "ensure_artosyn_cmake() {\n    apt-get update --fix-missing",
                  "ensure_artosyn_cmake() {\n    free_chroot_space_for_ci\n    apt-get update --fix-missing",
                  1,
              )
          chroot_text = chroot_text.replace(
              "apt-get install -y build-essential make gcc g++ libc6-dev || {",
              "apt-get install -y build-essential make gcc g++ libc6-dev cmake ninja-build || {",
              1,
          )
          if 'rm -rf /var/cache/apt/archives/*.deb /var/cache/man/* || true\n\n    if python3' not in chroot_text:
              chroot_text = chroot_text.replace(
                  "    }\n\n    if python3 - <<'PY'",
                  "    }\n    apt-get clean || true\n    rm -rf /var/cache/apt/archives/*.deb /var/cache/man/* || true\n\n    if python3 - <<'PY'",
                  1,
              )
          chroot_text = chroot_text.replace(
              'python3 -m pip install --upgrade "cmake>=3.22,<4" || { echo "Failed to install newer CMake"; exit 1; }',
              'python3 -m pip install --upgrade "cmake>=3.22,<4" \\\n'
              '        || python3 -m pip install --upgrade --break-system-packages "cmake>=3.22,<4" \\\n'
              '        || { echo "Failed to install newer CMake"; exit 1; }',
              1,
          )
          chroot_build.write_text(chroot_text)

          packages_stage = Path("/opt/OpenHD-ChrootCompiler/stages/02-Packages/00-run-chroot.sh")
          packages_text = packages_stage.read_text()
          packages_changed = False
          bind_out_marker = "[openhd] Bind-mounted host output directory"
          if bind_out_marker not in packages_text:
              old_mount_block = (
                  "HOST=$(cat /opt/additionalFiles/mount.txt)\n"
                  "mkdir /host\n"
                  "mount $HOST /host\n"
                  "INDIR=$(cat /opt/additionalFiles/pwd.txt)\n"
                  "OUTDIR=\"/host\"$INDIR\n"
                  "ln -s $OUTDIR /out\n"
                  "rm -Rf /out/*\n"
              )
              new_mount_block = (
                  "if [[ -f /opt/additionalFiles/host_out_dir.txt ]]; then\n"
                  "  HOST_OUT_DIR=$(cat /opt/additionalFiles/host_out_dir.txt)\n"
                  "  mkdir -p /out\n"
                  f"  echo \"{bind_out_marker}: ${{HOST_OUT_DIR}} -> /out\"\n"
                  "else\n"
                  "  HOST=$(cat /opt/additionalFiles/mount.txt)\n"
                  "  mkdir /host\n"
                  "  mount $HOST /host\n"
                  "  INDIR=$(cat /opt/additionalFiles/pwd.txt)\n"
                  "  OUTDIR=\"/host\"$INDIR\n"
                  "  ln -s $OUTDIR /out\n"
                  "fi\n"
                  "rm -Rf /out/*\n"
              )
              if old_mount_block not in packages_text:
                  raise SystemExit("Could not find ChrootCompiler /out mount block")
              packages_text = packages_text.replace(old_mount_block, new_mount_block, 1)
              packages_changed = True
          resize_marker = "[openhd] Expanding mounted root filesystem"
          if resize_marker not in packages_text:
              resize_patch = (
                  'root_dev="$(findmnt -n -o SOURCE / || true)"\n'
                  'if [[ -n "${root_dev}" ]] && command -v resize2fs >/dev/null 2>&1; then\n'
                  '    echo "[openhd] Expanding mounted root filesystem with chroot resize2fs: ${root_dev}"\n'
                  '    resize2fs -f "${root_dev}" || true\n'
                  '    df -h /\n'
                  'fi\n\n'
              )
              if not packages_text.startswith("#!/bin/bash"):
                  raise SystemExit("Could not find shebang in ChrootCompiler package stage")
              first_newline = packages_text.find("\n")
              packages_text = packages_text[:first_newline + 1] + "\n" + resize_patch + packages_text[first_newline + 1:]
              packages_changed = True
          packages_old = 'if [[ "${OS}" == "radxa-debian-rock5a" ]] || [[ "${OS}" == "radxa-debian-rock5b" ]]; then'
          packages_new = 'if [[ "${DISTRO}" == "bullseye" ]] && { [[ "${OS}" == "radxa-debian-rock5a" ]] || [[ "${OS}" == "radxa-debian-rock5b" ]]; }; then'
          if packages_new not in packages_text:
              if packages_old not in packages_text:
                  raise SystemExit("Could not find Rock5 package-preflight block in ChrootCompiler")
              packages_text = packages_text.replace(packages_old, packages_new, 1)
              packages_changed = True
          if packages_changed:
              packages_stage.write_text(packages_text)

          build_sh = Path("/opt/OpenHD-ChrootCompiler/build.sh")
          text = build_sh.read_text()
          original = text
          text = text.replace(
              "git clone https://github.com/OpenHD/OpenHD-ImageBuilder",
              "git clone -b dev-release https://github.com/OpenHD/OpenHD-ImageBuilder",
              1,
          )
          image_needle = "mv OpenHD-ImageBuilder/images .\n"
          image_patch = (
              image_needle
              + "for board in radxa-zero3w-lite radxa-zero3w; do\n"
              + "  if [ ! -f \"images/${board}\" ] && [ -f \"images/${board}_base\" ]; then\n"
              + "    cp \"images/${board}_base\" \"images/${board}\"\n"
              + "  fi\n"
              + "done\n"
              + "sed -i 's/^HAVE_CONF_PART=.*/HAVE_CONF_PART=false/' images/radxa-zero3w-lite\n"
              + "sed -i '/^CONF_PART=/d' images/radxa-zero3w-lite\n"
              + "echo \"Using generated radxa-zero3w-lite image target:\"\n"
              + "cat images/radxa-zero3w-lite\n"
          )
          if "images/${board}_base" not in text:
              if image_needle not in text:
                  raise SystemExit("Could not find ImageBuilder image import in build.sh")
              text = text.replace(image_needle, image_patch, 1)

          if "export BASE_IMAGE_SHA512" not in text:
              text = text.replace(
                  "export BASE_IMAGE_SHA256\n",
                  "export BASE_IMAGE_SHA256\nexport BASE_IMAGE_SHA512\n",
                  1,
              )

          needle = "mv OpenHD-ImageBuilder/stages/01-Baseimage stages/\n"
          patch = (
              needle
              + "sed -i 's/WANTEDSIZE=\"6800000000\"/WANTEDSIZE=\"15000000000\"/' stages/01-Baseimage/01-run.sh\n"
              + "sed -i 's/WANTEDSIZE=\"5632000000\"/WANTEDSIZE=\"15000000000\"/' stages/01-Baseimage/01-run.sh\n"
          )
          if "WANTEDSIZE=\"15000000000\"" not in text:
              if needle not in text:
                  raise SystemExit("Could not find ImageBuilder stage import in build.sh")
              text = text.replace(needle, patch, 1)
          if text != original:
              build_sh.write_text(text)
          PY
          sudo bash build.sh radxa-zero3w-lite "$API_KEY" debian bookworm

      - name: Collect artifacts
        run: |
          cp -r "$GITHUB_WORKSPACE/chroot-out/zero3w-lite"/*.deb .

      - name: Upload to Github
        uses: actions/upload-artifact@v4
        with:
          name: "OpenHD-zero3w-lite-bookworm-arm64"
          path: |
            *.deb

      - name: Resolve Cloudsmith target repo
        id: cloudsmith_repo
        run: |
          if [[ "${GITHUB_REF_NAME}" == "openhd-3.0" ]]; then
            echo "name=dev-release" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Push
        if: github.ref_name == 'release' || github.ref_name == 'dev-release' || github.ref_name == 'openhd-3.0'
        uses: cloudsmith-io/action@master
        with:
          api-key: ${{ secrets.CLOUDSMITH_API_KEY }}
          command: "push"
          format: "deb"
          owner: "openhd"
          repo: ${{ steps.cloudsmith_repo.outputs.name }}
          distro: "debian"
          release: "bookworm"
          republish: "true"
          file: "*.deb"
