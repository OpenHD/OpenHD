name: build_package_noble

on:
  push:
   branches:
      - "2.7-evo"
      - "release"

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    #runs-on: ubuntu-18.04
    runs-on: ubuntu-24.04
    env:
      CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
      DOWNLOAD_KEY: ${{ secrets.DOWNLOAD_KEY }}
      DOWNLOAD_URL: ${{ secrets.DOWNLOAD_URL }}
      OPENHD_SUBMODULE_TOKEN: ${{ secrets.OPENHD_SUBMODULE_TOKEN }}
      ARTLINK_REPO: https://github.com/OpenHD-Technologies/OpenHD-ArtLink.git
      ARTLINK_BRANCH: sdk
      ARTLINK_FETCH_MODE: git-only
      ARTLINK_GIT_AUTH_USERNAME: raphael@openhdfpv.org
      ARTLINK_GIT_AUTH: "raphael@openhdfpv.org:${{ secrets.OPENHD_SUBMODULE_TOKEN }}"
    steps:
      - name: test
        run: |
          echo "DT=$(date +'%Y-%m-%d_%H%M')" >> $GITHUB_ENV
          echo "BRANCH=${GITHUB_REF##*/}" >> $GITHUB_ENV

      - name: clone OpenHD
        run: |
          if [ -z "${OPENHD_SUBMODULE_TOKEN}" ]; then
            echo "OPENHD_SUBMODULE_TOKEN is required for recursive submodules"
            exit 1
          fi
          cleanup_git_auth() {
            git config --global --unset-all url."https://x-access-token:${OPENHD_SUBMODULE_TOKEN}@github.com/".insteadOf || true
          }
          trap cleanup_git_auth EXIT
          git config --global url."https://x-access-token:${OPENHD_SUBMODULE_TOKEN}@github.com/".insteadOf "https://github.com/"
          git clone -b ${{ github.ref_name }} https://github.com/OpenHD/OpenHD
          cd OpenHD
          git submodule sync --recursive
          git submodule update --init --recursive
          git submodule status --recursive

      - name: Install Dependencies
        run: |
          ls
          cd OpenHD
          sudo apt install libpoco-dev -y
          sudo ./install_build_dep.sh ubuntu-x86
      - name: Build with make
        run: |
          cd OpenHD
          sudo apt install -y python3-pip
          pip install cloudsmith-api --break-system-packages
          pip install cloudsmith-cli --break-system-packages
          sudo -E ./package.sh standard x86_64 ubuntu noble

      - name: Upload to Github
        uses: 'actions/upload-artifact@v4'
        with:
          name: "OpenHD"
          path: |
            OpenHD/*.deb
            *.log
          if-no-files-found: error

      - name: Push
        if: github.ref_name == 'release' || github.ref_name == 'dev-release'
        run: |
          ls -a
          cloudsmith push deb  -k ${{ secrets.CLOUDSMITH_API_KEY }} openhd/${{ github.ref_name }}/ubuntu/noble OpenHD/*.deb

