name: SonarCloud Analysis

on:
  push:
    branches:
      - openhd-3.0
  pull_request:
    branches:
      - openhd-3.0
  workflow_dispatch:

# CI-based analysis replaces SonarCloud's Automatic Analysis, which has to
# stay disabled for this project (Administration > Analysis Method); only
# CI-based analysis can import coverage and the compilation database.

permissions:
  pull-requests: read

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarcloud:
    name: Build and Analyze
    # Pull requests from forks have no access to SONAR_TOKEN.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DOWNLOAD_KEY: ${{ secrets.DOWNLOAD_KEY }}
      DOWNLOAD_URL: ${{ secrets.DOWNLOAD_URL }}
      OPENHD_SUBMODULE_TOKEN: ${{ secrets.OPENHD_SUBMODULE_TOKEN }}
      ARTLINK_REPO: https://github.com/OpenHD-Technologies/OpenHD-ArtLink.git
      ARTLINK_BRANCH: sdk
      ARTLINK_FETCH_MODE: git-first
      ARTLINK_GIT_AUTH_USERNAME: raphael@openhdfpv.org
      ARTLINK_GIT_AUTH: "raphael@openhdfpv.org:${{ secrets.OPENHD_SUBMODULE_TOKEN }}"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0
          token: ${{ secrets.OPENHD_SUBMODULE_TOKEN }}

      - uses: ./.github/actions/fetch-devourer

      - name: Ensure private submodule content
        run: |
          # Robustly handle private submodule content without failing the whole build
          if [ -d OpenHD/ohd_interface/video_crypto_private ]; then
            git -C OpenHD/ohd_interface/video_crypto_private fetch origin main || true
            git -C OpenHD/ohd_interface/video_crypto_private checkout -f origin/main || true
          fi

      - name: Install dependencies and sysutils
        uses: ./.github/actions/setup-native-build
        with:
          sysutils: "true"
          extra-packages: ccache python3-pip

      - name: Cache ccache data
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: ${{ runner.os }}-ccache-

      - name: Cache SonarCloud scanner and analysis data
        uses: actions/cache@v6
        with:
          path: |
            ~/.sonar/cache
            .sonar/analysis-cache
          key: ${{ runner.os }}-sonar-${{ github.sha }}
          restore-keys: ${{ runner.os }}-sonar-

      - name: Build with coverage and run the unit tests
        env:
          CCACHE_COMPILERCHECK: content
          CCACHE_BASEDIR: ${{ github.workspace }}
        run: |
          make ci_defconfig
          make test BUILD_DIR=build CMAKE_ARGS="-DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_FLAGS=--coverage -DCMAKE_EXE_LINKER_FLAGS=--coverage"

      - name: Generate Coverage Report
        run: |
          pip3 install --only-binary :all: gcovr==8.7
          gcovr --sonarqube -o coverage.xml -r . --exclude '.*lib/.*' --exclude '.*test/.*'

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          # Sources, compile commands and coverage come from
          # sonar-project.properties.
          args: >
            -Dsonar.cfamily.analysisCache.path=.sonar/analysis-cache
            -Dsonar.cfamily.analysisCache.mode=fs
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
