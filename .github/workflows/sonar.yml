name: SonarCloud Analysis

on:
  push:
    branches:
      - openhd-3.0
  workflow_dispatch:

permissions:
  pull-requests: read

jobs:
  sonarcloud:
    name: Build and Analyze
    runs-on: ubuntu-22.04
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DOWNLOAD_KEY: ${{ secrets.DOWNLOAD_KEY }}
      DOWNLOAD_URL: ${{ secrets.DOWNLOAD_URL }}
      OPENHD_SUBMODULE_TOKEN: ${{ secrets.OPENHD_SUBMODULE_TOKEN }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          token: ${{ secrets.OPENHD_SUBMODULE_TOKEN }}

      - name: Install modern CMake
        uses: lukka/get-cmake@latest

      - name: Sync submodules
        run: |
          git submodule sync
          git submodule update --init
          # Only initialize devourer, but avoid its broken/heavy reference sub-submodules
          git submodule update --init OpenHD/ohd_interface/lib/devourer
          git submodule status

      - name: Ensure private submodule content
        run: |
          # Robustly handle private submodule content without failing the whole build
          if [ -d OpenHD/ohd_interface/video_crypto_private ]; then
            git -C OpenHD/ohd_interface/video_crypto_private fetch origin main || true
            git -C OpenHD/ohd_interface/video_crypto_private checkout -f origin/main || true
          fi

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y libsodium-dev libpoco-dev python3-pip ccache ninja-build
          pip3 install gcovr kconfiglib
          sudo ./install_build_dep.sh ubuntu-x86

      - name: Install sysutils
        run: |
          curl -1sLf 'https://dl.cloudsmith.io/public/openhd/dev-release/setup.deb.sh' | sudo -E bash
          sudo apt update
          sudo apt install -y openhd-sys-utils

      - name: Cache ccache data
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: ${{ runner.os }}-ccache-

      - name: Cache SonarCloud scanner and analysis data
        uses: actions/cache@v4
        with:
          path: |
            ~/.sonar/cache
            .sonar/analysis-cache
          key: ${{ runner.os }}-sonar-${{ github.sha }}
          restore-keys: ${{ runner.os }}-sonar-

      - name: Build, Test and Generate Coverage with Makefile
        run: |
          export CCACHE_COMPILERCHECK=content
          export CCACHE_BASEDIR=$GITHUB_WORKSPACE
          
          # This single command now handles config, build, test, and report generation
          make coverage \
            EXTRA_CMAKE="-DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache"

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          args: >
            -Dsonar.cfamily.compile-commands=build/compile_commands.json
            -Dsonar.coverageReportPaths=coverage.xml
            -Dsonar.cfamily.analysisCache.path=.sonar/analysis-cache
            -Dsonar.cfamily.analysisCache.mode=fs
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
