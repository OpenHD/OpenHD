name: build_package_rpi

on:
  push:
    branches:
      - "master"
  workflow_dispatch: 

env:
  # CMake 빌드 유형 설정
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      # 1. 빌드 공간 확보: 라즈베리 파이 이미지 빌드를 위해 디스크 용량 정리
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 512
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          overprovision-lvm: 'true'

      # 2. 소스 코드 가져오기 (서브모듈 포함)
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # 3. ARM 환경(Raspberry Pi OS)에서 빌드 수행
      - uses: pguyot/arm-runner-action@v2
        id: build_image
        with:
          base_image: raspios_lite:2023-05-03
          image_additional_mb: 4000
          copy_repository_path: /opt
          copy_artifact_path: OpenHD_build
          import_github_env: true
          commands: |
            # 패키지 매니저 업데이트 및 git 설치 (Lite 버전에 git이 없으므로 추가)
            sudo apt-get update
            sudo apt-get install -y git

            # 소스 코드가 복사된 디렉토리로 이동
            cd /opt/OpenHD-AI
            
            # Git 보안 정책 예외 등록 (dubious ownership 에러 해결)
            git config --global --add safe.directory /opt/OpenHD-AI
            
            # 파일 목록 및 권한 확인
            ls -la
            
            # 스크립트에 실행 권한 부여
            chmod +x ./install_build_dep.sh
            chmod +x ./package.sh
            
            # 필요한 설정 파일 생성
            sudo mkdir -p /usr/local/share/openhd/
            sudo touch /usr/local/share/openhd/joyconfig.txt
            
            # 빌드 의존성 설치 및 패키징 스크립트 실행
            sudo ./install_build_dep.sh rpi
            sudo ./package.sh standard armhf raspbian bullseye

            # 생성된 deb 파일을 아티팩트 경로로 복사
            mkdir -p /opt/OpenHD-AI/OpenHD_build
            cp *.deb /opt/OpenHD-AI/OpenHD_build/ || echo "생성된 패키지가 없습니다."
            
            echo "빌드 완료 패키지 목록:"
            ls -l /opt/OpenHD-AI/OpenHD_build/

      # 4. 생성된 .deb 파일을 GitHub Actions 결과물로 업로드
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenHD-Package-RPi
          path: OpenHD_build/*.deb
          if-no-files-found: error
