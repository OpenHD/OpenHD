name: build_package_rpi

on:
  push:
    branches:
      - "master"
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Environment Setup
        run: |
          echo "DT=$(date +'%Y-%m-%d_%H%M')" >> $GITHUB_ENV
          echo "BRANCH=${GITHUB_REF##*/}" >> $GITHUB_ENV    

      # [핵심 수정 1] 기존 easimon 액션 대신 훨씬 강력하게 약 30GB를 비워주는 jlumbroso 액션으로 교체
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ARM용 패키지 캐시 설정
      - name: Cache ARM Dependencies
        uses: actions/cache@v4
        with:
          path: |
            **/build/*.o
            **/build/bin
          key: ${{ runner.os }}-arm-build-${{ hashFiles('install_build_dep.sh') }}

      - name: Build and Package for ARM
        uses: pguyot/arm-runner-action@v2
        id: build_image
        with:
          base_image: raspios_lite:2023-05-03
          # [핵심 수정 2] 5000MB는 디스크 에러 유발 확률이 너무 높습니다.
          # 패키징에는 3500MB(3.5GB)만 추가해도 아주 넉넉합니다.
          image_additional_mb: 3500
          copy_repository_path: /opt
          copy_artifact_path: OpenHD_build
          import_github_env: true
          commands: |
            # Git 보안 정책 및 디렉토리 설정 (한 번에 실행)
            git config --system --add safe.directory /opt/OpenHD-AI
            mkdir -p /usr/local/share/openhd/
            touch /usr/local/share/openhd/joyconfig.txt
            
            cd /opt/OpenHD-AI
            chmod +x ./install_build_dep.sh ./package.sh

            # apt-get update 횟수 최소화
            sudo ./install_build_dep.sh rpi
            
            # 빌드 및 패키징
            sudo ./package.sh standard armhf raspbian bullseye

            # 결과물 이동
            mkdir -p /opt/OpenHD_build
            cp *.deb /opt/OpenHD_build/ 2>/dev/null || true
            cp *.log /opt/OpenHD_build/ 2>/dev/null || true

      - name: Upload to Github
        uses: actions/upload-artifact@v4
        with:
          name: OpenHD-Package-RPi
          path: |
            OpenHD_build/*.deb
            OpenHD_build/*.log
          if-no-files-found: error