name: build_package_rpi

on:
  push:
    branches:
      - "2.7-evo"
      - "dev-release"
      - "release"
      - "openhd-3.0"
      - "openhd-3.0-test"
    paths-ignore:
      - "cross_compiling.md"
      - "scripts/*cross_sysroot.sh"
      - "scripts/build_portable_cross.sh"
      - "OpenHD/cmake/portable-linux-toolchain.cmake"
      - ".github/workflows/prepare_cross_sysroots.yml"

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
      DOWNLOAD_KEY: ${{ secrets.DOWNLOAD_KEY }}
      DOWNLOAD_URL: ${{ secrets.DOWNLOAD_URL }}
      OPENHD_SUBMODULE_TOKEN: ${{ secrets.OPENHD_SUBMODULE_TOKEN }}
      ARTLINK_REPO: https://github.com/OpenHD-Technologies/OpenHD-ArtLink.git
      ARTLINK_BRANCH: sdk
      ARTLINK_FETCH_MODE: git-only
      ARTLINK_GIT_AUTH_USERNAME: raphael@openhdfpv.org
      ARTLINK_GIT_AUTH: "raphael@openhdfpv.org:${{ secrets.OPENHD_SUBMODULE_TOKEN }}"
    steps:
    - name: Maximize build space
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 512
        swap-size-mb: 1024
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        overprovision-lvm: 'true'
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        token: ${{ secrets.OPENHD_SUBMODULE_TOKEN }}
    - uses: pguyot/arm-runner-action@98b8d5a3228f504a8bd54913ab1e23d70f369c6e
      id: build_image
      with:
        base_image: raspios_lite:2023-05-03
        image_additional_mb: 4000
        copy_repository_path: /opt
        copy_artifact_path: OpenHD
        import_github_env: true
        commands: |
            cd /opt
            cd OpenHD
            mkdir -p /usr/local/share/openhd/
            touch /usr/local/share/openhd/joyconfig.txt
            sudo ./install_build_dep.sh rpi
            cmake_ge_322() {
                v="$(cmake --version | awk 'NR==1{print $3}')"
                dpkg --compare-versions "$v" ge "3.22"
            }
            pip_install_cmake_compatible() {
                for cmake_spec in cmake==3.27.9 cmake==3.25.2 cmake==3.24.4 cmake==3.22.6; do
                    echo "Trying pip $cmake_spec"
                    sudo pip3 uninstall -y cmake >/dev/null 2>&1 || true
                    sudo pip3 install --upgrade "$cmake_spec" --break-system-packages || sudo pip3 install --upgrade "$cmake_spec" || true
                    if cmake --version >/dev/null 2>&1 && cmake_ge_322; then
                        echo "Using pip $cmake_spec"
                        return 0
                    fi
                done
                return 1
            }
            if ! cmake_ge_322; then
                echo "CMake < 3.22 detected, upgrading for Artosyn SDK build"
                echo "deb [trusted=yes] http://archive.debian.org/debian bullseye-backports main" | sudo tee /etc/apt/sources.list.d/bullseye-backports.list
                sudo apt-get -o Acquire::Check-Valid-Until=false -o Acquire::AllowInsecureRepositories=true -o Acquire::AllowDowngradeToInsecureRepositories=true update || true
                sudo apt-get install -y -t bullseye-backports cmake || true
            fi
            if ! cmake_ge_322; then
                echo "Backports cmake unavailable, trying pip cmake"
                sudo apt-get install -y python3-pip
                pip_install_cmake_compatible || true
            fi
            cmake --version
            if ! cmake_ge_322; then
                echo "CMake >= 3.22 is required for Artosyn SDK build" >&2
                exit 1
            fi
            cd /opt
            cd OpenHD
            chown -R root:root ../OpenHD
            sudo -E ./package.sh standard armhf raspbian bullseye

    - name: Upload to Github
      uses: 'actions/upload-artifact@v4'
      with:
        name: "OpenHD"
        path: |
          OpenHD/*.deb
        if-no-files-found: error

    - name: Resolve Cloudsmith target repo
      id: cloudsmith_repo
      run: |
        case "${GITHUB_REF_NAME}" in
          openhd-3.0|openhd-3.0-test)
            echo "name=dev-release" >> "$GITHUB_OUTPUT"
            ;;
          *)
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            ;;
        esac

    - name: Push
      id: push
      uses: cloudsmith-io/action@master
      with:
        api-key: ${{ secrets.CLOUDSMITH_API_KEY }}
        command: "push"
        format: "deb"
        owner: "openhd"
        repo: ${{ steps.cloudsmith_repo.outputs.name }}
        distro: "raspbian"
        release: "bullseye"
        republish: "true" # needed ONLY if version is not changing
        file: "OpenHD/*.deb"
      if: ${{ github.ref != 'refs/heads/2.5-evo' }}
