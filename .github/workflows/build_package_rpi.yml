name: build_package_rpi

on:
  push:
    branches:
      - "master"
  workflow_dispatch: 
env:
  # CMake 빌드 유형 설정 (Release, Debug 등)
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      # 1. 빌드 공간 확보: 라즈베리 파이 이미지 빌드를 위해 디스크 용량 정리
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 512
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          overprovision-lvm: 'true'

      # 2. 소스 코드 가져오기 (서브모듈 포함)
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # 3. ARM 환경(Raspberry Pi OS)에서 빌드 수행
      - uses: pguyot/arm-runner-action@v2
        id: build_image
        with:
          base_image: raspios_lite:2023-05-03
          image_additional_mb: 4000
          copy_repository_path: /opt
          copy_artifact_path: OpenHD_build
          import_github_env: true
          commands: |
            # 빌드 디렉토리로 이동
            cd /opt
            
            # 파일 목록 및 권한 확인
            ls -la
            
            # 스크립트에 실행 권한 부여
            chmod +x ./install_build_dep.sh
            chmod +x ./package.sh
            
            # 필요한 설정 파일 생성
            mkdir -p /usr/local/share/openhd/
            touch /usr/local/share/openhd/joyconfig.txt
            
            # 빌드 의존성 설치 및 패키징 스크립트 실행
            sudo ./install_build_dep.sh rpi
            chown -R root:root .
            sudo ./package.sh standard armhf raspbian bullseye

            # 생성된 deb 파일을 별도 디렉토리로 이동하여 찾기 쉽게 함
            mkdir /OpenHD_build
            mv *.deb /OpenHD_build/
            echo "Generated .deb file:"
            ls -l /OpenHD_build/

      # 4. 생성된 .deb 파일을 GitHub Actions 결과물로 업로드
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenHD-Package-RPi
          path: |
            OpenHD_build/*.deb
          if-no-files-found: error
