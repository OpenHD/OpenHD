name: build_package_rpi

on:
  push:
    branches:
      - "master"
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Environment Setup
        run: |
          echo "DT=$(date +'%Y-%m-%d_%H%M')" >> $GITHUB_ENV
          echo "BRANCH=${GITHUB_REF##*/}" >> $GITHUB_ENV    

      # [최적화] Clean UP 제거 (Maximize build space와 충돌 방지 및 불필요)

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048 # 여유 공간을 조금 더 확보
          swap-size-mb: 4096    # ARM 빌드는 메모리 소모가 커서 스왑을 늘리는 게 안전함
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 1. ARM용 패키지 캐시 설정
      # ARM 에뮬레이션 내부의 /var/cache/apt를 캐싱하는 것은 어려우므로,
      # 빌드 완료된 결과물이나 주요 의존성 로그를 기반으로 캐시 전략을 짭니다.
      - name: Cache ARM Dependencies
        uses: actions/cache@v4
        with:
          path: |
            **/build/*.o
            **/build/bin
          key: ${{ runner.os }}-arm-build-${{ hashFiles('install_build_dep.sh') }}

      - name: Build and Package for ARM
        uses: pguyot/arm-runner-action@v2
        id: build_image
        with:
          base_image: raspios_lite:2023-05-03
          image_additional_mb: 5000 # 패키징 공간 넉넉히 확보
          copy_repository_path: /opt
          copy_artifact_path: OpenHD_build
          import_github_env: true
          commands: |
            # Git 보안 정책 및 디렉토리 설정 (한 번에 실행)
            git config --system --add safe.directory /opt/OpenHD-AI
            mkdir -p /usr/local/share/openhd/
            touch /usr/local/share/openhd/joyconfig.txt
            
            cd /opt/OpenHD-AI
            chmod +x ./install_build_dep.sh ./package.sh

            # [핵심 최적화] apt-get update 횟수 최소화
            # install_build_dep.sh 내부에 update가 있다면 여기서 중복 실행할 필요 없음
            sudo ./install_build_dep.sh rpi
            
            # 빌드 및 패키징
            sudo ./package.sh standard armhf raspbian bullseye

            # 결과물 이동
            mkdir -p /opt/OpenHD_build
            cp *.deb /opt/OpenHD_build/ 2>/dev/null || true
            cp *.log /opt/OpenHD_build/ 2>/dev/null || true

      - name: Upload to Github
        uses: actions/upload-artifact@v4
        with:
          name: OpenHD-Package-RPi
          path: |
            OpenHD_build/*.deb
            OpenHD_build/*.log
          if-no-files-found: error