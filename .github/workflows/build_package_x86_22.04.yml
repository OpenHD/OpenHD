name: build_package_x86_22.04

on:
  push:
    branches:
      - "2.7-evo"
      - "dev-release"
      - "release"
      - "openhd-3.0"
    paths-ignore:
      - "cross_compiling.md"
      - "scripts/*cross_sysroot.sh"
      - "scripts/build_portable_cross.sh"
      - "OpenHD/cmake/portable-linux-toolchain.cmake"
      - ".github/workflows/prepare_cross_sysroots.yml"
  pull_request:
    branches:
      - "openhd-3.0"

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    #runs-on: ubuntu-18.04
    runs-on: ubuntu-22.04
    env:
      CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
      DOWNLOAD_KEY: ${{ secrets.DOWNLOAD_KEY }}
      DOWNLOAD_URL: ${{ secrets.DOWNLOAD_URL }}
      OPENHD_SUBMODULE_TOKEN: ${{ secrets.OPENHD_SUBMODULE_TOKEN }}
      ARTLINK_REPO: https://github.com/OpenHD-Technologies/OpenHD-ArtLink.git
      ARTLINK_BRANCH: sdk
      ARTLINK_FETCH_MODE: git-only
      ARTLINK_GIT_AUTH_USERNAME: raphael@openhdfpv.org
      ARTLINK_GIT_AUTH: "raphael@openhdfpv.org:${{ secrets.OPENHD_SUBMODULE_TOKEN }}"
    steps:
      - name: test
        run: |
          echo "DT=$(date +'%Y-%m-%d_%H%M')" >> $GITHUB_ENV
          echo "BRANCH=${GITHUB_REF##*/}" >> $GITHUB_ENV    

      - name: Clean UP
        run: |
          sudo rm -Rf *
              
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.OPENHD_SUBMODULE_TOKEN }}
      - name: fix Repository
        run: |
          sudo apt update
          sudo apt-mark hold grub-efi-amd64-signed
          sudo apt upgrade -y
          sudo apt install libpoco-dev -y
      - name: Install Dependencies
        run: |
          sudo ./install_build_dep.sh ubuntu-x86
      - name: Build with make
        run: |
          if [[ "${GITHUB_REF_NAME}" == "openhd-3.0" ]]; then
            export OPENHD_REQUIRE_ARTOSYN=1
            export OPENHD_REQUIRE_ARTOSYN_DAEMON=1
            echo "openhd-3.0: forcing Artosyn + daemon in package build"
          fi
          sudo -E ./package.sh standard x86_64 ubuntu jammy
          ls -a

      - name: Upload to Github
        uses: 'actions/upload-artifact@v4'
        with:
          name: "OpenHD"
          path: |
            *.deb
            *.log
          if-no-files-found: error

      - name: Resolve Cloudsmith target repo
        id: cloudsmith_repo
        run: |
          if [[ "${GITHUB_REF_NAME}" == "openhd-3.0" ]]; then
            echo "name=dev-release" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Push
        id: push
        if: github.ref_name == 'release' || github.ref_name == 'dev-release' || github.ref_name == 'openhd-3.0'
        uses: cloudsmith-io/action@master
        with:
          api-key: ${{ secrets.CLOUDSMITH_API_KEY }}
          command: "push"
          format: "deb"
          owner: "openhd"
          repo: ${{ steps.cloudsmith_repo.outputs.name }}
          distro: "ubuntu"
          release: "jammy"
          republish: "true" # needed ONLY if version is not changing
          file: "*.deb"
