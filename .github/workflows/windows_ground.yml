name: Windows ground backend
on:
  pull_request:
  push:
    branches: [openhd-3.0]
  workflow_dispatch:
jobs:
  ground:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public transport dependencies
        shell: pwsh
        run: git submodule update --init --checkout OpenHD/ohd_common/lib/spdlog OpenHD/ohd_common/lib/json OpenHD/ohd_interface/lib/wifibroadcast OpenHD/ohd_interface/lib/devourer
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-libusb
            mingw-w64-ucrt-x86_64-libsodium
            mingw-w64-ucrt-x86_64-pdcurses
      - name: Configure
        run: cmake -S OpenHD -B out/windows-ground -G Ninja -DCMAKE_BUILD_TYPE=Release -DOPENHD_PORTABLE_GROUND=ON -Dsodium_DIR="$(cygpath -m "$MINGW_PREFIX")"
      - name: Build
        run: cmake --build out/windows-ground --target openhd_ground test_ground_udp test_ground_pipeline test_ground_dashboard test_ground_app -j 4
      - name: Test
        run: ctest --test-dir out/windows-ground -R '^ground_' --output-on-failure
      - name: Package
        run: |
          mkdir -p out/windows-ground-package
          cp out/windows-ground/platform/ground/openhd_ground.exe out/windows-ground-package/
          cp "$MINGW_PREFIX"/bin/{libusb-1.0,libstdc++-6,libgcc_s_seh-1,libwinpthread-1}.dll out/windows-ground-package/
          cp "$MINGW_PREFIX"/bin/libsodium-*.dll out/windows-ground-package/
          cp docs/windows-ground.md out/windows-ground-package/README.md
          cp LICENSE out/windows-ground-package/
          cp -r "$MINGW_PREFIX"/share/licenses/{libusb,libsodium} out/windows-ground-package/
      - uses: actions/upload-artifact@v4
        with:
          name: openhd-windows-ground
          path: out/windows-ground-package
