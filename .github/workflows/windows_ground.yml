name: Windows ground backend
on:
  pull_request:
  push:
    branches: [openhd-3.0]
  workflow_dispatch:
env:
  # vcpkg binary cache, persisted with actions/cache below. Cold dependency
  # builds take ~15 min (libsodium/libusb via autotools); restored ~1 min.
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
jobs:
  ground:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - name: Fetch OpenHD-owned transport sources
        shell: pwsh
        run: git submodule update --init --checkout OpenHD/ohd_interface/lib/wifibroadcast OpenHD/ohd_interface/lib/devourer
      # MSYS2 only provides the compiler and build tools; libraries come from vcpkg.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
      - name: Toolchain fingerprint
        id: toolchain
        run: echo "gcc=$(gcc -dumpfullversion)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          # gcc is part of vcpkg's ABI hash; MSYS2 updates invalidate packages.
          key: vcpkg-mingw-${{ steps.toolchain.outputs.gcc }}-${{ hashFiles('OpenHD/vcpkg*.json', 'OpenHD/cmake/vcpkg-*/**') }}
          restore-keys: vcpkg-mingw-${{ steps.toolchain.outputs.gcc }}-
      - name: Configure
        run: |
          mkdir -p .vcpkg-cache
          export VCPKG_ROOT="$(cygpath -m "$VCPKG_INSTALLATION_ROOT")"
          cd OpenHD && cmake --preset windows-ground
      - name: Build
        run: cd OpenHD && cmake --build --preset windows-ground -j 4
      - name: Test
        run: cd OpenHD && ctest --preset windows-ground
      - name: Package
        run: |
          cmake --install out/windows-ground --prefix out/windows-ground-package
          mv out/windows-ground-package/bin/openhd_ground.exe out/windows-ground-package/
          rmdir out/windows-ground-package/bin
          cp docs/windows-ground.md out/windows-ground-package/README.md
          cp LICENSE out/windows-ground-package/
          mkdir -p out/windows-ground-package/licenses
          for p in libusb libsodium pdcursesmod spdlog fmt nlohmann-json; do
            cp out/windows-ground/vcpkg_installed/x64-mingw-static-release/share/$p/copyright out/windows-ground-package/licenses/$p.txt
          done
      - uses: actions/upload-artifact@v7
        with:
          name: openhd-windows-ground
          path: out/windows-ground-package
