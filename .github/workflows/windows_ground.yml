name: Windows ground backend
on:
  pull_request:
  push:
    branches: [openhd-3.0]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  ground:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - name: Fetch public transport dependencies
        shell: pwsh
        run: git submodule update --init --checkout OpenHD/ohd_common/lib/spdlog OpenHD/ohd_common/lib/json OpenHD/ohd_interface/lib/wifibroadcast OpenHD/ohd_interface/lib/devourer
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-libusb
            mingw-w64-ucrt-x86_64-libsodium
            mingw-w64-ucrt-x86_64-pdcurses
      - name: Configure
        run: cmake -S OpenHD -B out/windows-ground -G Ninja -DCMAKE_BUILD_TYPE=Release -DOPENHD_PORTABLE_GROUND=ON -Dsodium_DIR="$(cygpath -m "$MINGW_PREFIX")"
      - name: Build
        run: cmake --build out/windows-ground --target openhd_ground test_ground_udp test_ground_pipeline test_ground_rx_worker test_ground_dashboard test_ground_app -j 4
      - name: Test
        run: ctest --test-dir out/windows-ground -R '^ground_' --output-on-failure
      - name: Package
        run: |
          mkdir -p out/windows-ground-package
          cp out/windows-ground/platform/ground/openhd_ground.exe out/windows-ground-package/
          cp "$MINGW_PREFIX"/bin/{libusb-1.0,libstdc++-6,libgcc_s_seh-1,libwinpthread-1}.dll out/windows-ground-package/
          cp "$MINGW_PREFIX"/bin/libsodium-*.dll out/windows-ground-package/
          cp docs/windows-ground.md out/windows-ground-package/README.md
          cp LICENSE out/windows-ground-package/
          cp -r "$MINGW_PREFIX"/share/licenses/{libusb,libsodium} out/windows-ground-package/
      - uses: actions/upload-artifact@v7
        with:
          name: openhd-windows-ground-Unsigned
          path: out/windows-ground-package
          if-no-files-found: error

  test-sign:
    name: Sign Windows ground backend (test certificate)
    if: github.repository == 'OpenHD/OpenHD' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: ground
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate test signing configuration
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_TEST_CERTIFICATE_BASE64: ${{ vars.SIGNPATH_TEST_CERTIFICATE_BASE64 }}
        run: |
          foreach ($name in @('SIGNPATH_API_TOKEN', 'SIGNPATH_TEST_CERTIFICATE_BASE64')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing required setting: $name"
            }
          }
      - uses: actions/download-artifact@v4
        with:
          name: openhd-windows-ground-Unsigned
          path: out/windows-ground-package
      - name: Upload executable for origin-verified signing
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: openhd-ground-unsigned-executable
          path: out/windows-ground-package/openhd_ground.exe
          if-no-files-found: error
          retention-days: 7
      - name: Request test signature
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: 630b3214-208a-4670-bfa3-1955f878b88c
          project-slug: OpenHD
          signing-policy-slug: test-signing
          artifact-configuration-slug: windows-ground-test
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: out/signed-ground
      - name: Verify signature and package test executable
        shell: pwsh
        env:
          TEST_CERTIFICATE_BASE64: ${{ vars.SIGNPATH_TEST_CERTIFICATE_BASE64 }}
        run: |
          & scripts/trust_signpath_test_certificate.ps1 -CertificateBase64 $Env:TEST_CERTIFICATE_BASE64
          # GITHUB_ENV becomes available to later steps, so read the pin directly here.
          $certificate = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
            [Convert]::FromBase64String($Env:TEST_CERTIFICATE_BASE64))
          try {
            & scripts/verify_windows_signature.ps1 -Path out/signed-ground/openhd_ground.exe `
              -SigningMode test -ExpectedSignerThumbprint $certificate.Thumbprint
          } finally {
            $certificate.Dispose()
          }
          Copy-Item -LiteralPath out/signed-ground/openhd_ground.exe -Destination out/windows-ground-package/openhd_ground.exe -Force
          'Experimental test-signed build. The certificate is not publicly trusted. Not a production release.' |
            Set-Content out/windows-ground-package/TEST-SIGNED.txt
      - uses: actions/upload-artifact@v4
        with:
          name: openhd-windows-ground-Test-Signed
          path: out/windows-ground-package
          if-no-files-found: error
