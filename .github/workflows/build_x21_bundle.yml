name: Build X21B OpenHD component

on:
  workflow_dispatch:
  push:
    branches:
      - openhd-3.0
    paths:
      - OpenHD/**
      - scripts/build_x21_component.sh
      - .github/workflows/build_x21_bundle.yml

permissions:
  contents: read

concurrency:
  group: x21b-openhd-component-${{ github.ref }}
  cancel-in-progress: true

env:
  X21_INPUT_BASE_URL: https://dl.cloudsmith.io/public/openhd/dev-release/raw/files

jobs:
  component:
    runs-on: ubuntu-24.04
    env:
      CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
    steps:
      - name: Validate credentials
        env:
          OPENHD_SUBMODULE_TOKEN: ${{ secrets.OPENHD_SUBMODULE_TOKEN }}
        run: |
          test -n "${OPENHD_SUBMODULE_TOKEN}" || {
            echo "::error::OPENHD_SUBMODULE_TOKEN needs read access to OpenHD-X21B and the private OpenHD submodules"
            exit 1
          }

      - name: Checkout OpenHD
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          token: ${{ secrets.OPENHD_SUBMODULE_TOKEN }}

      - name: Checkout build submodules without Devourer references
        env:
          OPENHD_SUBMODULE_TOKEN: ${{ secrets.OPENHD_SUBMODULE_TOKEN }}
        run: |
          set -euo pipefail
          set +x
          git config --global \
            url."https://x-access-token:${OPENHD_SUBMODULE_TOKEN}@github.com/".insteadOf \
            https://github.com/
          git submodule update --init
          git -C OpenHD/ohd_interface/lib/devourer \
            config submodule.reference/rtl8852cu.update none

      - name: Download and verify the stable X21B SDK
        run: |
          set -euo pipefail
          mkdir -p x21-sdk-artifact
          cd x21-sdk-artifact
          for name in openhd-x21b-sdk.tar.gz openhd-x21b-sdk.tar.gz.sha256 openhd-x21b-sdk.manifest.json; do
            curl --fail --location --retry 5 --retry-delay 3 \
              "${X21_INPUT_BASE_URL}/${name}" -o "${name}"
          done
          sha256sum -c openhd-x21b-sdk.tar.gz.sha256
          tar -xzf openhd-x21b-sdk.tar.gz -C "${RUNNER_TEMP}"
          echo "X21_SDK_SHA256=$(sha256sum openhd-x21b-sdk.tar.gz | awk '{print $1}')" >>"${GITHUB_ENV}"
          echo "X21_SDK_BUILDROOT_COMMIT=$(python3 -c 'import json; print(json.load(open("openhd-x21b-sdk.manifest.json"))["buildroot_commit"])')" >>"${GITHUB_ENV}"
          echo "X21_SDK_DIR=${RUNNER_TEMP}/openhd-x21b-sdk" >>"${GITHUB_ENV}"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ ninja-build

      - name: Cross-compile and package OpenHD
        run: ./scripts/build_x21_component.sh "${X21_SDK_DIR}" "${GITHUB_WORKSPACE}/x21-component"

      - name: Upload OpenHD component artifact
        uses: actions/upload-artifact@v4
        with:
          name: openhd-x21b-component
          path: x21-component/
          if-no-files-found: error
          retention-days: 30

      - name: Install Cloudsmith CLI
        if: env.CLOUDSMITH_API_KEY != ''
        run: pipx install cloudsmith-cli

      - name: Publish component files to Cloudsmith
        if: env.CLOUDSMITH_API_KEY != ''
        run: |
          set -euo pipefail
          for package in x21-component/*; do
            cloudsmith push raw --republish openhd/dev-release "${package}"
          done

      - name: Trigger ImageBuilder X21 assembly
        if: env.CLOUDSMITH_API_KEY != ''
        env:
          GH_TOKEN: ${{ secrets.OPENHD_SUBMODULE_TOKEN }}
        run: |
          set -euo pipefail
          base=https://dl.cloudsmith.io/public/openhd/dev-release/raw/files
          if ! curl --fail --silent --show-error --location \
            "${base}/openhd-x21b-latest.tar.gz.manifest.json" -o /tmp/openhd.json || \
             ! curl --fail --silent --show-error --location \
            "${base}/openhd-sys-utils-x21b-latest.tar.gz.manifest.json" -o /tmp/sysutils.json; then
            echo "The other X21B component is not published yet; ImageBuilder will be triggered by its workflow."
            exit 0
          fi
          if ! python3 -c 'import json; a=json.load(open("/tmp/openhd.json")); b=json.load(open("/tmp/sysutils.json")); assert a["sdk_sha256"] == b["sdk_sha256"]'; then
            echo "The published X21B components use different SDKs; waiting for the other component to rebuild."
            exit 0
          fi
          gh workflow run update-image.yml --repo OpenHD/OpenHD-ImageBuilder --ref dev-release -f target=x21-update
