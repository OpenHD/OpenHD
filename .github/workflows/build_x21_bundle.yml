name: Build X21B application bundle

on:
  workflow_dispatch:
  push:
    branches:
      - openhd-3.0
    paths:
      - OpenHD/**
      - scripts/build_x21_bundle.sh
      - .github/workflows/build_x21_bundle.yml

permissions:
  contents: read

env:
  X21_SDK_REPOSITORY: OpenHD/OpenHD-X21B
  X21_SDK_RUN_ID: "34408323283"
  X21_SDK_ARTIFACT: openhd-x21b-sdk

jobs:
  bundle:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout OpenHD and submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          token: ${{ secrets.OPENHD_SUBMODULE_TOKEN }}

      - name: Checkout build submodules without Devourer references
        shell: bash
        env:
          OPENHD_SUBMODULE_TOKEN: ${{ secrets.OPENHD_SUBMODULE_TOKEN }}
        run: |
          set -euxo pipefail
          test -n "${OPENHD_SUBMODULE_TOKEN}"
          set +x
          git config --global \
            url."https://x-access-token:${OPENHD_SUBMODULE_TOKEN}@github.com/".insteadOf \
            https://github.com/
          set -x
          git submodule update --init
          git -C OpenHD/ohd_interface/lib/devourer \
            config submodule.reference/rtl8852cu.update none

      - name: Checkout SysUtils
        uses: actions/checkout@v4
        with:
          repository: OpenHD/OpenHD-SysUtils
          path: OpenHD-SysUtils
          fetch-depth: 0

      - name: Download pinned X21B SDK artifact
        uses: actions/download-artifact@v4
        with:
          repository: ${{ env.X21_SDK_REPOSITORY }}
          run-id: ${{ env.X21_SDK_RUN_ID }}
          name: ${{ env.X21_SDK_ARTIFACT }}
          github-token: ${{ secrets.OPENHD_SUBMODULE_TOKEN }}
          path: x21-sdk-artifact

      - name: Verify and extract X21B SDK
        shell: bash
        run: |
          set -euxo pipefail
          cd x21-sdk-artifact
          sha256sum -c openhd-x21b-sdk.tar.gz.sha256
          tar -xzf openhd-x21b-sdk.tar.gz -C "${RUNNER_TEMP}"

          sdk_sha256="$(sha256sum openhd-x21b-sdk.tar.gz | awk '{print $1}')"
          buildroot_commit="$(python3 -c \
            'import json; print(json.load(open("openhd-x21b-sdk.manifest.json"))["buildroot_commit"])')"
          echo "X21_SDK_SHA256=${sdk_sha256}" >>"${GITHUB_ENV}"
          echo "X21_SDK_BUILDROOT_COMMIT=${buildroot_commit}" >>"${GITHUB_ENV}"
          echo "X21_SDK_DIR=${RUNNER_TEMP}/openhd-x21b-sdk" >>"${GITHUB_ENV}"

      - name: Install bundle tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ ninja-build zstd

      - name: Cross-compile X21B bundle
        shell: bash
        run: |
          ./scripts/build_x21_bundle.sh \
            "${X21_SDK_DIR}" \
            "${GITHUB_WORKSPACE}/OpenHD-SysUtils" \
            "${GITHUB_WORKSPACE}/x21-bundle"

      - name: Upload X21B application bundle
        uses: actions/upload-artifact@v4
        with:
          name: openhd-x21b-bundle
          path: x21-bundle/
          if-no-files-found: error
          retention-days: 30
