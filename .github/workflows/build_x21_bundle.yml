name: Build X21B application bundle

on:
  workflow_call:
    inputs:
      openhd_ref:
        description: OpenHD branch, tag, or commit to build
        required: false
        type: string
        default: openhd-3.0
    secrets:
      OPENHD_SUBMODULE_TOKEN:
        required: true
      CLOUDSMITH_API_KEY:
        required: false
  workflow_dispatch:
    inputs:
      openhd_ref:
        description: OpenHD branch, tag, or commit to build
        required: false
        type: string
        default: openhd-3.0
  push:
    branches:
      - openhd-3.0
    paths:
      - OpenHD/**
      - scripts/build_x21_bundle.sh
      - .github/workflows/build_x21_bundle.yml

permissions:
  contents: read

env:
  X21_SDK_REPOSITORY: OpenHD/OpenHD-X21B
  X21_SDK_RUN_ID: "34479273960"
  X21_SDK_ARTIFACT: openhd-x21b-sdk
  X21_OHD_SEED_RUN_ID: "34479273960"
  X21_OHD_SEED_ARTIFACT: openhd-x21b-ohd-root

jobs:
  bundle:
    runs-on: ubuntu-24.04
    env:
      CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
    steps:
      - name: Validate access to private X21B build inputs
        shell: bash
        env:
          OPENHD_SUBMODULE_TOKEN: ${{ secrets.OPENHD_SUBMODULE_TOKEN }}
        run: |
          if [[ -z "${OPENHD_SUBMODULE_TOKEN}" ]]; then
            echo "::error::OPENHD_SUBMODULE_TOKEN must be available to the calling ImageBuilder repository. It needs read access to OpenHD/OpenHD-X21B and the private OpenHD source submodules."
            exit 1
          fi

      - name: Checkout OpenHD and submodules
        uses: actions/checkout@v4
        with:
          repository: OpenHD/OpenHD
          ref: ${{ inputs.openhd_ref || github.sha }}
          fetch-depth: 0
          submodules: false
          token: ${{ secrets.OPENHD_SUBMODULE_TOKEN }}

      - name: Checkout build submodules without Devourer references
        shell: bash
        env:
          OPENHD_SUBMODULE_TOKEN: ${{ secrets.OPENHD_SUBMODULE_TOKEN }}
        run: |
          set -euxo pipefail
          test -n "${OPENHD_SUBMODULE_TOKEN}"
          set +x
          git config --global \
            url."https://x-access-token:${OPENHD_SUBMODULE_TOKEN}@github.com/".insteadOf \
            https://github.com/
          set -x
          git submodule update --init
          git -C OpenHD/ohd_interface/lib/devourer \
            config submodule.reference/rtl8852cu.update none

      - name: Checkout SysUtils
        uses: actions/checkout@v4
        with:
          repository: OpenHD/OpenHD-SysUtils
          path: OpenHD-SysUtils
          fetch-depth: 0

      - name: Download pinned X21B SDK artifact
        uses: actions/download-artifact@v4
        with:
          repository: ${{ env.X21_SDK_REPOSITORY }}
          run-id: ${{ env.X21_SDK_RUN_ID }}
          name: ${{ env.X21_SDK_ARTIFACT }}
          github-token: ${{ secrets.OPENHD_SUBMODULE_TOKEN }}
          path: x21-sdk-artifact

      - name: Verify and extract X21B SDK
        shell: bash
        run: |
          set -euxo pipefail
          cd x21-sdk-artifact
          sha256sum -c openhd-x21b-sdk.tar.gz.sha256
          tar -xzf openhd-x21b-sdk.tar.gz -C "${RUNNER_TEMP}"

          sdk_sha256="$(sha256sum openhd-x21b-sdk.tar.gz | awk '{print $1}')"
          buildroot_commit="$(python3 -c \
            'import json; print(json.load(open("openhd-x21b-sdk.manifest.json"))["buildroot_commit"])')"
          echo "X21_SDK_SHA256=${sdk_sha256}" >>"${GITHUB_ENV}"
          echo "X21_SDK_BUILDROOT_COMMIT=${buildroot_commit}" >>"${GITHUB_ENV}"
          echo "X21_SDK_DIR=${RUNNER_TEMP}/openhd-x21b-sdk" >>"${GITHUB_ENV}"

      - name: Install bundle tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake cpio fakeroot file g++ mtd-utils ninja-build zstd

      - name: Download X21B OHD filesystem seed artifact
        uses: actions/download-artifact@v4
        with:
          repository: ${{ env.X21_SDK_REPOSITORY }}
          run-id: ${{ env.X21_OHD_SEED_RUN_ID }}
          name: ${{ env.X21_OHD_SEED_ARTIFACT }}
          github-token: ${{ secrets.OPENHD_SUBMODULE_TOKEN }}
          path: x21-ohd-seed-artifact

      - name: Verify and extract X21B OHD filesystem seed
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p x21-ohd-seed
          (
            cd x21-ohd-seed-artifact
            sha256sum -c openhd-x21b-ohd-root.tar.gz.sha256
          )
          seed_sha256="$(sha256sum x21-ohd-seed-artifact/openhd-x21b-ohd-root.tar.gz | awk '{print $1}')"
          echo "X21_OHD_SEED_SHA256=${seed_sha256}" >>"${GITHUB_ENV}"
          tar -xzf x21-ohd-seed-artifact/openhd-x21b-ohd-root.tar.gz \
            -C x21-ohd-seed

      - name: Cross-compile X21B bundle
        shell: bash
        run: |
          fakeroot -- ./scripts/build_x21_bundle.sh \
            "${X21_SDK_DIR}" \
            "${GITHUB_WORKSPACE}/OpenHD-SysUtils" \
            "${GITHUB_WORKSPACE}/x21-ohd-seed" \
            "${GITHUB_WORKSPACE}/x21-bundle"

      - name: Upload X21B application bundle
        uses: actions/upload-artifact@v4
        with:
          name: openhd-x21b-bundle
          path: x21-bundle/
          if-no-files-found: error
          retention-days: 30

      - name: Publish X21B bundle to Cloudsmith
        if: env.CLOUDSMITH_API_KEY != ''
        uses: cloudsmith-io/action@master
        with:
          api-key: ${{ secrets.CLOUDSMITH_API_KEY }}
          command: push
          format: raw
          owner: openhd
          repo: dev-release
          republish: "true"
          file: "x21-bundle/*.tar.zst"

      - name: Publish X21B bundle checksum to Cloudsmith
        if: env.CLOUDSMITH_API_KEY != ''
        uses: cloudsmith-io/action@master
        with:
          api-key: ${{ secrets.CLOUDSMITH_API_KEY }}
          command: push
          format: raw
          owner: openhd
          repo: dev-release
          republish: "true"
          file: "x21-bundle/*.tar.zst.sha256"

      - name: Publish X21B bundle manifest to Cloudsmith
        if: env.CLOUDSMITH_API_KEY != ''
        uses: cloudsmith-io/action@master
        with:
          api-key: ${{ secrets.CLOUDSMITH_API_KEY }}
          command: push
          format: raw
          owner: openhd
          repo: dev-release
          republish: "true"
          file: "x21-bundle/*.tar.zst.manifest.json"

      - name: Publish latest X21B SWUpdate package to Cloudsmith
        if: env.CLOUDSMITH_API_KEY != ''
        uses: cloudsmith-io/action@master
        with:
          api-key: ${{ secrets.CLOUDSMITH_API_KEY }}
          command: push
          format: raw
          owner: openhd
          repo: dev-release
          republish: "true"
          file: "x21-bundle/OpenHD-X21B-latest.ohd"

      - name: Publish latest X21B update checksum to Cloudsmith
        if: env.CLOUDSMITH_API_KEY != ''
        uses: cloudsmith-io/action@master
        with:
          api-key: ${{ secrets.CLOUDSMITH_API_KEY }}
          command: push
          format: raw
          owner: openhd
          repo: dev-release
          republish: "true"
          file: "x21-bundle/OpenHD-X21B-latest.ohd.sha256"

      - name: Publish latest X21B update manifest to Cloudsmith
        if: env.CLOUDSMITH_API_KEY != ''
        uses: cloudsmith-io/action@master
        with:
          api-key: ${{ secrets.CLOUDSMITH_API_KEY }}
          command: push
          format: raw
          owner: openhd
          repo: dev-release
          republish: "true"
          file: "x21-bundle/OpenHD-X21B-latest.ohd.manifest.json"

      - name: Publish X21B ImageWriter catalog to Cloudsmith
        if: env.CLOUDSMITH_API_KEY != ''
        uses: cloudsmith-io/action@master
        with:
          api-key: ${{ secrets.CLOUDSMITH_API_KEY }}
          command: push
          format: raw
          owner: openhd
          repo: dev-release
          republish: "true"
          file: "x21-bundle/openhd-x21b-updates.json"
