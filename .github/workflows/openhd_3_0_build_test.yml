name: openhd_3_0_build_test

on:
  push:
    branches:
      - openhd-3.0
  pull_request:
    branches:
      - openhd-3.0
  workflow_dispatch:

jobs:
  build-and-run-air-ground-test:
    runs-on: ubuntu-22.04
    env:
      DOWNLOAD_KEY: ${{ secrets.DOWNLOAD_KEY }}
      DOWNLOAD_URL: ${{ secrets.DOWNLOAD_URL }}
      ARTLINK_DOWNLOAD_KEY: ${{ secrets.DOWNLOAD_KEY }}
      ARTLINK_DOWNLOAD_URL: ${{ secrets.DOWNLOAD_URL }}
      OPENHD_SUBMODULE_TOKEN: ${{ secrets.OPENHD_SUBMODULE_TOKEN }}
      ARTLINK_REPO: https://github.com/OpenHD-Technologies/OpenHD-ArtLink.git
      ARTLINK_BRANCH: sdk
      ARTLINK_FETCH_MODE: git-first
      ARTLINK_GIT_AUTH_USERNAME: raphael@openhdfpv.org
      ARTLINK_GIT_AUTH: "raphael@openhdfpv.org:${{ secrets.OPENHD_SUBMODULE_TOKEN }}"
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
          token: ${{ secrets.OPENHD_SUBMODULE_TOKEN }}
      - uses: ./.github/actions/fetch-devourer
      - name: Checkout private video crypto
        uses: actions/checkout@v7
        with:
          repository: OpenHD-Technologies/video_crypto_private
          ref: main
          token: ${{ secrets.OPENHD_SUBMODULE_TOKEN }}
          path: OpenHD/ohd_interface/video_crypto_private
      - name: Install dependencies and sysutils
        uses: ./.github/actions/setup-native-build
        with:
          sysutils: "true"
      - name: Build private video crypto
        run: |
          cd OpenHD/ohd_interface/video_crypto_private
          cmake -S . -B build
          cmake --build build
      - name: Build private video crypto client
        run: |
          cd OpenHD/ohd_interface/video_crypto_private/client
          g++ -std=c++17 client.cpp -lsodium -o ohd_video_crypto_client
      - name: Build wifibroadcast dummy encryption test
        run: |
          cd OpenHD/ohd_interface/lib/wifibroadcast
          cmake -S . -B build
          cmake --build build --target test_dummy_link
      - name: Run wifibroadcast dummy encryption test
        run: |
          ./OpenHD/ohd_interface/lib/wifibroadcast/build/test_dummy_link
      - name: Build
        run: |
          make ci_defconfig
          make
      - name: Unit tests
        run: make test
      - name: Exercise Microhard configuration and UDP transport
        run: |
          cmake --build OpenHD/build --target test_microhard_config --parallel 2
          timeout 30s ./OpenHD/build/ohd_interface/test_microhard_config
      - name: Exercise camera worker isolation and libcamera recovery
        run: |
          sudo apt-get install -y gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-tools
          # Ubuntu's plugins-bad package does not contain RidgeRun's perf
          # element. Use the same release as the ORQA SDK setup.
          curl --fail --location --retry 3 \
            https://github.com/RidgeRun/gst-perf/archive/refs/tags/v0.3.1.tar.gz \
            -o "${RUNNER_TEMP}/gst-perf.tar.gz"
          tar -xf "${RUNNER_TEMP}/gst-perf.tar.gz" -C "${RUNNER_TEMP}"
          (
            cd "${RUNNER_TEMP}/gst-perf-0.3.1"
            ./autogen.sh
            ./configure --prefix=/usr --libdir="/usr/lib/$(dpkg-architecture -qDEB_HOST_MULTIARCH)"
            make -j2
            sudo make install
          )
          gst-inspect-1.0 perf
          cmake --build OpenHD/build --target test_gst_camera_process --parallel 2
          timeout 120s ./OpenHD/build/ohd_video/test_gst_camera_process
      - name: Run as air and ground (limited)
        run: |
          SYSUTIL_BIN="$(command -v openhd_sys_utils || command -v openhd-sys-utils || true)"
          if [ -z "$SYSUTIL_BIN" ]; then
            SYSUTIL_BIN="$(dpkg -L openhd-sys-utils | grep -E '/(sbin|bin)/openhd' | head -n1 || true)"
          fi
          for mode in -a -g; do
            if [ -n "$SYSUTIL_BIN" ]; then
              sudo nohup "$SYSUTIL_BIN" > /tmp/openhd_sysutils.log 2>&1 &
            else
              echo "WARNING: sysutils binary not found"
            fi
            for i in $(seq 1 20); do
              if [ -S /run/openhd/openhd_sys.sock ]; then
                echo "sysutils socket ready"
                break
              fi
              sleep 0.5
            done
            ps -ef | grep -v grep | grep -E "openhd_sys_utils|openhd-sys-utils" || true
            sudo ./OpenHD/build/openhd "$mode" --run-time-seconds 10 --emulate-monitor-card
          done

  update-x21-buildroot-version:
    name: Update X21 Buildroot OpenHD revision
    # Application-only X21 updates now use the cross-compiled Cloudsmith
    # component. Keep this legacy Buildroot pin update as an explicit action
    # for changes that genuinely require a new base/SDK image.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout X21 Buildroot
        uses: actions/checkout@v7
        with:
          repository: OpenHD/openhd_x21b_buildroot
          ref: master
          token: ${{ secrets.BUILDROOT_REPOSITORY_TOKEN }}
          path: buildroot-package-update

      - name: Update OpenHD version in X21 Buildroot
        working-directory: buildroot-package-update
        run: |
          package_file="package/OpenHD/openhd.mk"
          sed -i -E \
            "s|^OPENHD_VERSION[[:space:]]*=.*$|OPENHD_VERSION = ${GITHUB_SHA}|" \
            "${package_file}"

          if git diff --quiet -- "${package_file}"; then
            echo "Buildroot already points to ${GITHUB_SHA}"
            exit 0
          fi

          git config user.name "OpenHD-Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${package_file}"
          git commit -m "package/OpenHD: update to ${GITHUB_SHA}"
          git push origin HEAD:master
