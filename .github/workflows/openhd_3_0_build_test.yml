name: openhd_3_0_build_test

on:
  push:
    branches:
      - openhd-3.0
    paths-ignore:
      - "cross_compiling.md"
      - "scripts/*cross_sysroot.sh"
      - "scripts/build_portable_cross.sh"
      - "OpenHD/cmake/portable-linux-toolchain.cmake"
      - ".github/workflows/prepare_cross_sysroots.yml"
  pull_request:
    branches:
      - openhd-3.0
  workflow_dispatch:

jobs:
  build-and-run-air-ground-test:
    runs-on: ubuntu-22.04
    env:
      DOWNLOAD_KEY: ${{ secrets.DOWNLOAD_KEY }}
      DOWNLOAD_URL: ${{ secrets.DOWNLOAD_URL }}
      ARTLINK_DOWNLOAD_KEY: ${{ secrets.DOWNLOAD_KEY }}
      ARTLINK_DOWNLOAD_URL: ${{ secrets.DOWNLOAD_URL }}
      OPENHD_SUBMODULE_TOKEN: ${{ secrets.OPENHD_SUBMODULE_TOKEN }}
      ARTLINK_REPO: https://github.com/OpenHD-Technologies/OpenHD-ArtLink.git
      ARTLINK_BRANCH: sdk
      ARTLINK_FETCH_MODE: git-first
      ARTLINK_GIT_AUTH_USERNAME: raphael@openhdfpv.org
      ARTLINK_GIT_AUTH: "raphael@openhdfpv.org:${{ secrets.OPENHD_SUBMODULE_TOKEN }}"
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.OPENHD_SUBMODULE_TOKEN }}
      - name: Sync submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive
          git submodule status --recursive
      - name: Ensure private submodule content
        run: |
          if [ ! -f OpenHD/ohd_interface/video_crypto_private/CMakeLists.txt ]; then
            echo "Submodule content missing, updating to latest main..."
            git -C OpenHD/ohd_interface/video_crypto_private fetch origin main
            git -C OpenHD/ohd_interface/video_crypto_private checkout -f origin/main
          fi
          if [ ! -f OpenHD/ohd_interface/video_crypto_private/CMakeLists.txt ]; then
            echo "Missing video_crypto_private content. Ensure the private repo has the files and is accessible."
            exit 1
          fi
          git -C OpenHD/ohd_interface/video_crypto_private rev-parse HEAD
      - name: Install Dependencies
        run: |
          sudo mkdir -p /Videos/
          sudo apt update
          sudo apt install -y libsodium-dev
          sudo ./install_build_dep.sh ubuntu-x86
      - name: Install sysutils
        run: |
          curl -1sLf 'https://dl.cloudsmith.io/public/openhd/dev-release/setup.deb.sh' | sudo -E bash
          sudo apt update
          sudo apt install -y openhd-sys-utils
      - name: Build private video crypto
        run: |
          cd OpenHD/ohd_interface/video_crypto_private
          cmake -S . -B build
          cmake --build build
      - name: Build private video crypto client
        run: |
          cd OpenHD/ohd_interface/video_crypto_private/client
          g++ -std=c++17 client.cpp -lsodium -o ohd_video_crypto_client
      - name: Preflight Artosyn SDK + interface build (fail fast)
        run: |
          cd OpenHD
          source ./scripts/resolve_artosyn_sdk.sh
          resolve_artosyn_sdk
          cmake -S . -B build_artosyn_preflight \
            -DARTOSYN_SDK_ROOT="${ARTOSYN_SDK_ROOT}" \
            -DARTOSYN_SDK_LIB="${ARTOSYN_SDK_LIB}"
          cmake --build build_artosyn_preflight --target OHDInterfaceLib -- -j"$(nproc)"
      - name: Build wifibroadcast dummy encryption test
        run: |
          cd OpenHD/ohd_interface/lib/wifibroadcast
          cmake -S . -B build
          cmake --build build --target test_dummy_link
      - name: Run wifibroadcast dummy encryption test
        run: |
          ./OpenHD/ohd_interface/lib/wifibroadcast/build/test_dummy_link
      - name: Build
        run: |
          cd OpenHD
          ./build_cmake.sh
      - name: Run as air (limited)
        run: |
          SYSUTIL_BIN="$(command -v openhd_sys_utils || command -v openhd-sys-utils || true)"
          if [ -z "$SYSUTIL_BIN" ]; then
            SYSUTIL_BIN="$(dpkg -L openhd-sys-utils | grep -E '/(sbin|bin)/openhd' | head -n1 || true)"
          fi
          if [ -n "$SYSUTIL_BIN" ]; then
            sudo nohup "$SYSUTIL_BIN" > /tmp/openhd_sysutils.log 2>&1 &
          else
            echo "WARNING: sysutils binary not found"
          fi
          for i in $(seq 1 20); do
            if [ -S /run/openhd/openhd_sys.sock ]; then
              echo "sysutils socket ready"
              break
            fi
            sleep 0.5
          done
          ps -ef | grep -v grep | grep -E "openhd_sys_utils|openhd-sys-utils" || true
          sudo ./OpenHD/build/openhd -a --run-time-seconds 10 --emulate-monitor-card
      - name: Run as ground (limited)
        run: |
          SYSUTIL_BIN="$(command -v openhd_sys_utils || command -v openhd-sys-utils || true)"
          if [ -z "$SYSUTIL_BIN" ]; then
            SYSUTIL_BIN="$(dpkg -L openhd-sys-utils | grep -E '/(sbin|bin)/openhd' | head -n1 || true)"
          fi
          if [ -n "$SYSUTIL_BIN" ]; then
            sudo nohup "$SYSUTIL_BIN" > /tmp/openhd_sysutils.log 2>&1 &
          else
            echo "WARNING: sysutils binary not found"
          fi
          for i in $(seq 1 20); do
            if [ -S /run/openhd/openhd_sys.sock ]; then
              echo "sysutils socket ready"
              break
            fi
            sleep 0.5
          done
          ps -ef | grep -v grep | grep -E "openhd_sys_utils|openhd-sys-utils" || true
          sudo ./OpenHD/build/openhd -g --run-time-seconds 10 --emulate-monitor-card

      - name: Checkout X21 Buildroot
        if: github.event_name == 'push' && github.ref == 'refs/heads/openhd-3.0'
        uses: actions/checkout@v4
        with:
          repository: OpenHD/openhd_x21b_buildroot
          ref: master
          token: ${{ secrets.BUILDROOT_REPOSITORY_TOKEN }}
          path: buildroot-package-update

      - name: Update OpenHD version in X21 Buildroot
        if: github.event_name == 'push' && github.ref == 'refs/heads/openhd-3.0'
        working-directory: buildroot-package-update
        run: |
          package_file="package/OpenHD/openhd.mk"
          sed -i -E \
            "s|^OPENHD_VERSION[[:space:]]*=.*$|OPENHD_VERSION = ${GITHUB_SHA}|" \
            "${package_file}"

          if git diff --quiet -- "${package_file}"; then
            echo "Buildroot already points to ${GITHUB_SHA}"
            exit 0
          fi

          git config user.name "OpenHD-Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${package_file}"
          git commit -m "package/OpenHD: update to ${GITHUB_SHA}"
          git push origin HEAD:master
