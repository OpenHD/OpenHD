name: openhd_3_0_build_test

on:
  push:
    branches:
      - openhd-3.0
  pull_request:
    branches:
      - openhd-3.0
  workflow_dispatch:

jobs:
  build-and-run-air-ground-test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.OPENHD_SUBMODULE_TOKEN }}
      - name: Sync submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive
          git submodule status --recursive
      - name: Ensure private submodule content
        run: |
          if [ ! -f OpenHD/ohd_interface/video_crypto_private/CMakeLists.txt ]; then
            echo "Submodule content missing, updating to latest main..."
            git -C OpenHD/ohd_interface/video_crypto_private fetch origin main
            git -C OpenHD/ohd_interface/video_crypto_private checkout -f origin/main
          fi
          if [ ! -f OpenHD/ohd_interface/video_crypto_private/CMakeLists.txt ]; then
            echo "Missing video_crypto_private content. Ensure the private repo has the files and is accessible."
            exit 1
          fi
          git -C OpenHD/ohd_interface/video_crypto_private rev-parse HEAD
      - name: Install Dependencies
        run: |
          sudo mkdir -p /Videos/
          sudo apt update
          sudo apt install -y libsodium-dev
          sudo ./install_build_dep.sh ubuntu-x86
      - name: Install sysutils
        run: |
          curl -1sLf 'https://dl.cloudsmith.io/public/openhd/dev-release/setup.deb.sh' | sudo -E bash
          sudo apt update
          sudo apt install -y openhd-sys-utils
      - name: Build private video crypto
        run: |
          cd OpenHD/ohd_interface/video_crypto_private
          cmake -S . -B build
          cmake --build build
      - name: Build private video crypto client
        run: |
          cd OpenHD/ohd_interface/video_crypto_private/client
          g++ -std=c++17 client.cpp -lsodium -o ohd_video_crypto_client
      - name: Build wifibroadcast dummy encryption test
        run: |
          cd OpenHD/ohd_interface/lib/wifibroadcast
          cmake -S . -B build
          cmake --build build --target test_dummy_link
      - name: Run wifibroadcast dummy encryption test
        run: |
          ./OpenHD/ohd_interface/lib/wifibroadcast/build/test_dummy_link
      - name: Build
        run: |
          cd OpenHD
          ./build_cmake.sh
      - name: Run as air (limited)
        run: |
          SYSUTIL_BIN="$(command -v openhd_sys_utils || command -v openhd-sys-utils || true)"
          if [ -z "$SYSUTIL_BIN" ]; then
            SYSUTIL_BIN="$(dpkg -L openhd-sys-utils | grep -E '/(sbin|bin)/openhd' | head -n1 || true)"
          fi
          if [ -n "$SYSUTIL_BIN" ]; then
            sudo nohup "$SYSUTIL_BIN" > /tmp/openhd_sysutils.log 2>&1 &
          else
            echo "WARNING: sysutils binary not found"
          fi
          for i in $(seq 1 20); do
            if [ -S /run/openhd/openhd_sys.sock ]; then
              echo "sysutils socket ready"
              break
            fi
            sleep 0.5
          done
          ps -ef | grep -v grep | grep -E "openhd_sys_utils|openhd-sys-utils" || true
          sudo ./OpenHD/build/openhd -a --run-time-seconds 10 --emulate-monitor-card
      - name: Run as ground (limited)
        run: |
          SYSUTIL_BIN="$(command -v openhd_sys_utils || command -v openhd-sys-utils || true)"
          if [ -z "$SYSUTIL_BIN" ]; then
            SYSUTIL_BIN="$(dpkg -L openhd-sys-utils | grep -E '/(sbin|bin)/openhd' | head -n1 || true)"
          fi
          if [ -n "$SYSUTIL_BIN" ]; then
            sudo nohup "$SYSUTIL_BIN" > /tmp/openhd_sysutils.log 2>&1 &
          else
            echo "WARNING: sysutils binary not found"
          fi
          for i in $(seq 1 20); do
            if [ -S /run/openhd/openhd_sys.sock ]; then
              echo "sysutils socket ready"
              break
            fi
            sleep 0.5
          done
          ps -ef | grep -v grep | grep -E "openhd_sys_utils|openhd-sys-utils" || true
          sudo ./OpenHD/build/openhd -g --run-time-seconds 10 --emulate-monitor-card
