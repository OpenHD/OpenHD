name: build_rpi_bookworm_imx415

on:
  push:
    branches:
      - "feature/arducam-imx415-rpi"
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Maximize build space
      uses: easimon/maximize-build-space@c28619d8999a147d5e09c1199f84ff6af6ad5794
      with:
        root-reserve-mb: 512
        swap-size-mb: 1024
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        overprovision-lvm: 'true'

    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: pguyot/arm-runner-action@98b8d5a3228f504a8bd54913ab1e23d70f369c6e
      id: build_image
      with:
        # Bullseye is required: libcamera-openhd on cloudsmith is only built for
        # raspbian/bullseye. IMX415 kernel+libcamera support is installed at
        # runtime on the target Pi via scripts/setup_rpi_imx415.sh.
        base_image: raspios_lite:2023-05-03
        image_additional_mb: 4000
        copy_repository_path: /opt
        copy_artifact_path: OpenHD
        copy_artifacts_on_fail: yes
        import_github_env: true
        commands: |
            mkdir -p /usr/local/share/openhd/
            touch /usr/local/share/openhd/joyconfig.txt
            cd /opt
            sudo ./install_build_dep.sh rpi
            chown -R root:root /opt
            sudo ./package.sh standard armhf raspbian bullseye
            cp /out/*.deb /opt/OpenHD/

    - name: Upload .deb artifact
      uses: actions/upload-artifact@v4
      with:
        name: openhd-rpi-imx415
        path: OpenHD/*.deb
        if-no-files-found: error
        retention-days: 30
