name: build_rpi_bookworm_imx415

on:
  push:
    branches:
      - "feature/arducam-imx415-rpi"
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Maximize build space
      uses: easimon/maximize-build-space@c28619d8999a147d5e09c1199f84ff6af6ad5794
      with:
        root-reserve-mb: 512
        swap-size-mb: 1024
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        overprovision-lvm: 'true'

    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: pguyot/arm-runner-action@98b8d5a3228f504a8bd54913ab1e23d70f369c6e
      id: build_image
      with:
        base_image: raspios_lite:2023-05-03
        image_additional_mb: 6000
        copy_repository_path: /opt
        copy_artifact_path: OpenHD
        copy_artifacts_on_fail: yes
        import_github_env: true
        commands: |
            mkdir -p /usr/local/share/openhd/
            touch /usr/local/share/openhd/joyconfig.txt

            # ── 1. Build libcamera-openhd 1.3.0-imx415 from our fork ───────────
            # Note: arducam SDK requires libstdc++6 >= 11 (unavailable on Bullseye).
            # Our meson.build already strips arducam cam_helpers so no SDK needed.
            sudo apt-get update -qq
            sudo apt-get install -y \
              libboost-dev git python3-pip ruby-dev libgnutls28-dev openssl \
              libtiff5-dev meson libegl1-mesa-dev cmake \
              libboost-program-options-dev libdrm-dev libexif-dev \
              libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
              python3-pybind11 ninja-build

            python3 -m pip install --upgrade pip setuptools wheel
            python3 -m pip install 'MarkupSafe<3.0'
            python3 -m pip install pyyaml ply jinja2
            python3 -m pip install --upgrade meson
            gem install fpm

            git clone --depth=1 --branch feature/add-imx415 \
              https://github.com/JFullerFPV/libcamera.git /tmp/libcamera-src
            cd /tmp/libcamera-src

            mkdir -p /tmp/libcamera-install
            meson build --buildtype=release \
              -Dpipelines=rpi/vc4 -Dipas=rpi/vc4 \
              -Dv4l2=true -Dgstreamer=enabled -Dtest=false \
              -Dlc-compliance=disabled -Dcam=disabled -Dqcam=disabled \
              -Ddocumentation=disabled -Dpycamera=enabled \
              -Dlibexecdir=/usr/lib/arm-linux-gnueabihf --prefix=/usr
            DESTDIR=/tmp/libcamera-install ninja -C build install

            fpm -a armhf -s dir -t deb -n libcamera-openhd -v 1.3.0-imx415 \
              -C /tmp/libcamera-install \
              -p /opt/OpenHD/libcamera-openhd-imx415_armhf.deb \
              --conflicts "libcamera-dev" --conflicts "libcamera0"
            sudo apt-get purge -y python3-libcamera libcamera0 || true
            sudo dpkg -i /opt/OpenHD/libcamera-openhd-imx415_armhf.deb

            # ── 2. Build OpenHD against our IMX415-enabled libcamera ────────────
            # install_build_dep.sh adds cloudsmith repo but apt will not downgrade
            # libcamera-openhd since our 1.3.0-imx415 > cloudsmith 1.2.7
            cd /opt/OpenHD
            sudo ./install_build_dep.sh rpi
            chown -R root:root /opt/OpenHD
            sudo ./package.sh standard armhf raspbian bullseye

    - name: Upload .deb artifacts
      uses: actions/upload-artifact@v4
      with:
        name: openhd-rpi-imx415
        path: OpenHD/*.deb
        if-no-files-found: error
        retention-days: 30
