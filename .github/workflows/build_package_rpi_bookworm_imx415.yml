name: build_rpi_bookworm_imx415

on:
  push:
    branches:
      - "feature/arducam-imx415-rpi"
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Maximize build space
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 512
        swap-size-mb: 1024
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        overprovision-lvm: 'true'

    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: pguyot/arm-runner-action@98b8d5a3228f504a8bd54913ab1e23d70f369c6e
      id: build_image
      with:
        # Bookworm image (kernel 6.12+, libcamera 0.5+, imx415 driver included)
        base_image: raspios_lite:2024-11-19
        image_additional_mb: 4000
        copy_repository_path: /opt
        copy_artifact_path: OpenHD
        import_github_env: true
        commands: |
            cd /opt/OpenHD
            mkdir -p /usr/local/share/openhd/
            touch /usr/local/share/openhd/joyconfig.txt
            sudo ./install_build_dep.sh rpi
            chown -R root:root /opt/OpenHD
            sudo ./package.sh standard armhf raspbian bookworm

    - name: Upload .deb artifact
      uses: actions/upload-artifact@v4
      with:
        name: openhd-rpi-bookworm-imx415
        path: OpenHD/*.deb
        if-no-files-found: error
        retention-days: 30
