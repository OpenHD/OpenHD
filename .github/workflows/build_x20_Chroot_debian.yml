name: build_package_x20_debian

on:
  push:
   branches:
      - "2.7-evo"
      - "dev-release"
      - "release"
      - "openhd-3.0"

jobs:
  build:
    #runs-on: ubuntu-18.04
    runs-on: ubuntu-22.04
    env:
      CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
      OPENHD_SUBMODULE_TOKEN: ${{ secrets.OPENHD_SUBMODULE_TOKEN }}
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 512
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          overprovision-lvm: 'true'
      - name: test
        run: |
          echo "DT=$(date +'%Y-%m-%d_%H%M')" >> $GITHUB_ENV
          echo "BRANCH=${GITHUB_REF##*/}" >> $GITHUB_ENV    
             
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
          token: ${{ secrets.OPENHD_SUBMODULE_TOKEN }}
      - name: Building OpenHD in CHROOT
        run: |
          git clone https://github.com/OpenHD/OpenHD-ChrootCompiler /opt/OpenHD-ChrootCompiler
          mkdir -p /opt/OpenHD-ChrootCompiler/additionalFiles
          if [ -z "${OPENHD_SUBMODULE_TOKEN}" ]; then
            echo "OPENHD_SUBMODULE_TOKEN is required for recursive submodules"
            exit 1
          fi
          cleanup_git_auth() {
            git config --global --unset-all url."https://x-access-token:${OPENHD_SUBMODULE_TOKEN}@github.com/".insteadOf || true
          }
          trap cleanup_git_auth EXIT
          git config --global url."https://x-access-token:${OPENHD_SUBMODULE_TOKEN}@github.com/".insteadOf "https://github.com/"
          git clone https://github.com/OpenHD/OpenHD -b ${{ github.ref_name }} /opt/OpenHD-ChrootCompiler/additionalFiles/
          git -C /opt/OpenHD-ChrootCompiler/additionalFiles submodule sync --recursive
          git -C /opt/OpenHD-ChrootCompiler/additionalFiles submodule update --init --recursive
          git -C /opt/OpenHD-ChrootCompiler/additionalFiles submodule status --recursive
          echo $CLOUDSMITH_API_KEY > /opt/OpenHD-ChrootCompiler/additionalFiles/cloudsmith_api_key.txt
          echo "true" > /opt/OpenHD-ChrootCompiler/additionalFiles/custom.txt
          echo "armhf" > /opt/OpenHD-ChrootCompiler/additionalFiles/arch.txt
          echo "debian" > /opt/OpenHD-ChrootCompiler/additionalFiles/distro.txt
          echo "bullseye" > /opt/OpenHD-ChrootCompiler/additionalFiles/flavor.txt
          echo "${{ github.ref_name }}" > /opt/OpenHD-ChrootCompiler/additionalFiles/repo.txt

          cd /opt/OpenHD-ChrootCompiler/
          sudo apt update
          sudo bash install_dep.sh
          sudo bash ./build.sh x20-compile $API_KEY debian bullseye
      
      - name: debug
        run:
          cp -r /opt/OpenHD-ChrootCompiler/out/* .

      - name: Upload to Github
        uses: 'actions/upload-artifact@v4'
        with:
          name: "OpenHD"
          path: |
            *.deb

      - name: Push
        id: push
        if: github.ref_name == 'release' || github.ref_name == 'dev-release' || github.ref_name == 'openhd-3.0'
        uses: cloudsmith-io/action@master
        with:
          api-key: ${{ secrets.CLOUDSMITH_API_KEY }}
          command: "push"
          format: "deb"
          owner: "openhd"
          repo: ${{ github.ref_name == 'openhd-3.0' && 'dev-release' || github.ref_name }}
          distro: "debian"
          release: "bullseye"
          republish: "true" # needed ONLY if version is not changing
          file: "*.deb"
