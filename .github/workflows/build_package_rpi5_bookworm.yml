name: build_package_rpi5_bookworm

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Existing successful run ID to republish without rebuilding
        required: false
        type: string
  push:
    branches:
      - "release"
      - "openhd-3.0-test"

env:
  BUILD_TYPE: Release

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
      DOWNLOAD_KEY: ${{ secrets.DOWNLOAD_KEY }}
      DOWNLOAD_URL: ${{ secrets.DOWNLOAD_URL }}
      OPENHD_SUBMODULE_TOKEN: ${{ secrets.OPENHD_SUBMODULE_TOKEN }}
      ARTLINK_REPO: https://github.com/OpenHD-Technologies/OpenHD-ArtLink.git
      ARTLINK_BRANCH: sdk
      ARTLINK_FETCH_MODE: git-only
      ARTLINK_GIT_AUTH_USERNAME: raphael@openhdfpv.org
      ARTLINK_GIT_AUTH: "raphael@openhdfpv.org:${{ secrets.OPENHD_SUBMODULE_TOKEN }}"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.OPENHD_SUBMODULE_TOKEN }}

      - name: Build arm64 Bookworm package
        if: github.event_name != 'workflow_dispatch' || inputs.artifact_run_id == ''
        uses: pguyot/arm-runner-action@e1773de1ed6eb61848f5693de824d836f0b0ea25
        with:
          base_image: https://downloads.raspberrypi.com/raspios_lite_arm64/images/raspios_lite_arm64-2025-05-13/2025-05-13-raspios-bookworm-arm64-lite.img.xz
          cpu: cortex-a76
          image_additional_mb: 5000
          copy_repository_path: /opt
          copy_artifact_path: OpenHD
          import_github_env: true
          shell: /bin/bash -euo pipefail
          commands: |
            cd /opt/OpenHD
            mkdir -p /usr/local/share/openhd
            touch /usr/local/share/openhd/joyconfig.txt
            ./install_build_dep.sh rpi
            chown -R root:root /opt/OpenHD
            ./package.sh standard arm64 raspbian bookworm

      - name: Upload package
        if: github.event_name != 'workflow_dispatch' || inputs.artifact_run_id == ''
        uses: actions/upload-artifact@v4
        with:
          name: OpenHD-RPi5-Bookworm-arm64
          path: OpenHD/*_arm64.deb
          if-no-files-found: error

      - name: Download existing package artifact
        if: github.event_name == 'workflow_dispatch' && inputs.artifact_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: OpenHD-RPi5-Bookworm-arm64
          path: OpenHD
          github-token: ${{ github.token }}
          run-id: ${{ inputs.artifact_run_id }}

      - name: Resolve Cloudsmith target repo
        id: cloudsmith_repo
        run: |
          case "${GITHUB_REF_NAME}" in
            openhd-3.0|openhd-3.0-test)
              echo "name=dev-release" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Push package for Raspbian Bookworm
        uses: cloudsmith-io/action@master
        with:
          api-key: ${{ secrets.CLOUDSMITH_API_KEY }}
          command: push
          format: deb
          owner: openhd
          repo: ${{ steps.cloudsmith_repo.outputs.name }}
          distro: raspbian
          release: bookworm
          republish: "true"
          file: OpenHD/*_arm64.deb
